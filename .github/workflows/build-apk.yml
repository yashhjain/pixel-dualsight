                      )
                      frontContainer.setRenderEffect(
                          if (frontLookIndex == 0) null
                          else RenderEffect.createColorFilterEffect(ColorMatrixColorFilter(getColorMatrixForLook(frontLookIndex)))
                      )
                  }
                  if (rearLookIndex != 0 || frontLookIndex != 0) {
                      splitGradeBadge.text = "R: ${lookLabels[rearLookIndex]} • F: ${lookLabels[frontLookIndex]}"
                      splitGradeBadge.visibility = View.VISIBLE
                  } else {
                      splitGradeBadge.visibility = View.GONE
                  }
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupTouchGestures() {
                  val scaleDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScale(detector: ScaleGestureDetector): Boolean {
                          val nextZoom = (currentZoom * detector.scaleFactor).coerceIn(deviceMinZoom, deviceMaxZoom)
                          val now = SystemClock.uptimeMillis()
                          if (now - lastZoomApplyMs >= 24L) {
                              lastZoomApplyMs = now
                              setZoomSmooth(nextZoom, fromPresetButton = false)
                          }
                          return true
                      }
                  })

                  var touchDownX = 0f
                  var touchDownY = 0f
                  var isMultiTouch = false

                  stageCard.setOnTouchListener { _, event ->
                      scaleDetector.onTouchEvent(event)
                      when (event.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              touchDownX = event.x
                              touchDownY = event.y
                              isMultiTouch = false
                          }
                          MotionEvent.ACTION_POINTER_DOWN -> {
                              isMultiTouch = true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!isMultiTouch && abs(event.x - touchDownX) < dp(18) && abs(event.y - touchDownY) < dp(18)) {
                                  triggerTapToFocus(event.x, event.y, focusFront = false)
                              }
                          }
                      }
                      true
                  }

                  var dX = 0f
                  var dY = 0f
                  var moved = false
                  val attachDrag = { targetView: FrameLayout, isFrontView: Boolean ->
                      targetView.setOnTouchListener { v, event ->
                          val isFloating = (layoutMode == 0 || layoutMode == 1)
                          val secondaryContainer = if (swapSlots) rearContainer else frontContainer

                          if (event.pointerCount >= 2) {
                              scaleDetector.onTouchEvent(event)
                              return@setOnTouchListener true
                          }

                          if (!isFloating || v !== secondaryContainer) {
                              if (event.actionMasked == MotionEvent.ACTION_UP) {
                                  triggerTapToFocus(v.x + event.x, v.y + event.y, focusFront = isFrontView)
                              }
                              return@setOnTouchListener true
                          }

                          when (event.actionMasked) {
                              MotionEvent.ACTION_DOWN -> {
                                  dX = v.x - event.rawX
                                  dY = v.y - event.rawY
                                  moved = false
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val maxX = (stageCard.width - v.width - dp(8)).coerceAtLeast(dp(8)).toFloat()
                                  val maxY = (stageCard.height - v.height - dp(8)).coerceAtLeast(dp(42)).toFloat()
                                  val newX = (event.rawX + dX).coerceIn(dp(8).toFloat(), maxX)
                                  val newY = (event.rawY + dY).coerceIn(dp(42).toFloat(), maxY)
                                  if (abs(newX - v.x) > 4f || abs(newY - v.y) > 4f) moved = true
                                  v.x = newX
                                  v.y = newY
                                  pipDragX = newX
                                  pipDragY = newY
                                  hasCustomPipPos = true
                                  true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!moved) {
                                      triggerTapToFocus(v.x + event.x, v.y + event.y, focusFront = isFrontView)
                                  }
                                  true
                              }
                              else -> false
                          }
                      }
                  }
                  attachDrag(frontContainer, true)
                  attachDrag(rearContainer, false)
              }

              private fun triggerTapToFocus(stageX: Float, stageY: Float, focusFront: Boolean) {
                  stageCard.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                  evControlBox.visibility = View.VISIBLE

                  val maxAssX = (stageCard.width - dp(190)).coerceAtLeast(dp(8)).toFloat()
                  val maxAssY = (stageCard.height - dp(76)).coerceAtLeast(dp(8)).toFloat()
                  focusAssembly.x = (stageX - dp(34)).coerceIn(dp(8).toFloat(), maxAssX)
                  focusAssembly.y = (stageY - dp(34)).coerceIn(dp(8).toFloat(), maxAssY)

                  val zoomBubble = focusAssembly.findViewById<TextView>(1001)
                  if (focusFront) {
                      zoomBubble?.text = "1x"
                      focusTagTitle.text = "FRONT ${frontSensorMp}MP"
                      focusTagSub.text = "AF • FOCUSING..."
                  } else {
                      zoomBubble?.text = formatZoomLabel(currentZoom)
                      focusTagTitle.text = when {
                          currentZoom < 0.92f -> "ULTRA-WIDE"
                          currentZoom >= 2.8f -> "TELEPHOTO"
                          else -> "WIDE"
                      }
                      focusTagSub.text = "${rearSensorMp}MP • AF SCANNING"
                  }

                  focusAssembly.scaleX = 1.18f
                  focusAssembly.scaleY = 1.18f
                  focusAssembly.alpha = 1f
                  focusAssembly.animate()
                      .scaleX(1f)
                      .scaleY(1f)
                      .setDuration(140)
                      .withEndAction {
                          focusAssembly.animate().alpha(0f).setStartDelay(1300).setDuration(260).start()
                      }
                      .start()

                  try {
                      if (focusFront && frontCamera != null) {
                          val localFX = (stageX - frontContainer.x).coerceIn(0f, previewFront.width.toFloat().coerceAtLeast(1f))
                          val localFY = (stageY - frontContainer.y).coerceIn(0f, previewFront.height.toFloat().coerceAtLeast(1f))
                          val fPoint = previewFront.meteringPointFactory.createPoint(localFX, localFY)
                          val fAction = FocusMeteringAction.Builder(
                              fPoint,
                              FocusMeteringAction.FLAG_AF or FocusMeteringAction.FLAG_AE or FocusMeteringAction.FLAG_AWB
                          ).setAutoCancelDuration(4, TimeUnit.SECONDS).build()
                          val fFuture = frontCamera?.cameraControl?.startFocusAndMetering(fAction)
                          fFuture?.addListener({
                              focusTagSub.text = "${frontSensorMp}MP • AF LOCKED"
                              shutterSound.play(MediaActionSound.FOCUS_COMPLETE)
                          }, ContextCompat.getMainExecutor(this))
                      } else {
                          val localRX = (stageX - rearContainer.x).coerceIn(0f, previewRear.width.toFloat().coerceAtLeast(1f))
                          val localRY = (stageY - rearContainer.y).coerceIn(0f, previewRear.height.toFloat().coerceAtLeast(1f))
                          val rPoint = previewRear.meteringPointFactory.createPoint(localRX, localRY)
                          val rAction = FocusMeteringAction.Builder(
                              rPoint,
                              FocusMeteringAction.FLAG_AF or FocusMeteringAction.FLAG_AE or FocusMeteringAction.FLAG_AWB
                          ).setAutoCancelDuration(4, TimeUnit.SECONDS).build()
                          val rFuture = rearCamera?.cameraControl?.startFocusAndMetering(rAction)
                          rFuture?.addListener({
                              focusTagSub.text = "${rearSensorMp}MP • AF LOCKED"
                              shutterSound.play(MediaActionSound.FOCUS_COMPLETE)
                          }, ContextCompat.getMainExecutor(this))
                      }
                  } catch (ignored: Exception) {
                  }
              }

              private fun discoverDeviceCameraProfile(provider: ProcessCameraProvider) {
                  try {
                      val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      var maxRearPixels = 0L
                      var maxFrontPixels = 0L
                      var minZ = 1.0f
                      var maxZ = 8.0f

                      for (camId in cm.cameraIdList) {
                          val chars = cm.getCameraCharacteristics(camId)
                          val facing = chars.get(CameraCharacteristics.LENS_FACING)
                          val pixelArray = chars.get(CameraCharacteristics.SENSOR_INFO_PIXEL_ARRAY_SIZE)
                          val activeRect = chars.get(CameraCharacteristics.SENSOR_INFO_ACTIVE_ARRAY_SIZE)
                          val mpCount = if (pixelArray != null) {
                              pixelArray.width.toLong() * pixelArray.height.toLong()
                          } else if (activeRect != null) {
                              activeRect.width().toLong() * activeRect.height().toLong()
                          } else 0L

                          val streamMap: StreamConfigurationMap? = chars.get(CameraCharacteristics.SCALER_STREAM_CONFIGURATION_MAP)
                          val rawSizes = streamMap?.getOutputSizes(SurfaceTexture::class.java)
                          val sizeList = mutableListOf<Size>()
                          if (rawSizes != null) {
                              for (sz in rawSizes) {
                                  if (sz != null) sizeList.add(sz)
                              }
                          }

                          if (facing != null && facing == CameraCharacteristics.LENS_FACING_BACK) {
                              if (mpCount > maxRearPixels) maxRearPixels = mpCount

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                                  val zRange: Range<Float>? = chars.get(CameraCharacteristics.CONTROL_ZOOM_RATIO_RANGE)
                                  if (zRange != null) {
                                      val zLow: Float = zRange.lower ?: 1.0f
                                      val zHigh: Float = zRange.upper ?: 8.0f
                                      minZ = min(minZ, zLow)
                                      maxZ = max(maxZ, zHigh)
                                  }
                              } else {
                                  val digMax: Float = chars.get(CameraCharacteristics.SCALER_AVAILABLE_MAX_DIGITAL_ZOOM) ?: 8.0f
                                  maxZ = max(maxZ, digMax)
                              }

                              val best16x9 = pickBestResolution(sizeList, 16f / 9f)
                              val best4x3 = pickBestResolution(sizeList, 4f / 3f)
                              if (best16x9.width * best16x9.height > bestRear16x9Size.width * bestRear16x9Size.height) {
                                  bestRear16x9Size = best16x9
                              }
                              if (best4x3.width * best4x3.height > bestRear4x3Size.width * bestRear4x3Size.height) {
                                  bestRear4x3Size = best4x3
                              }
                          } else if (facing != null && facing == CameraCharacteristics.LENS_FACING_FRONT) {
                              if (mpCount > maxFrontPixels) maxFrontPixels = mpCount

                              val best16x9 = pickBestResolution(sizeList, 16f / 9f)
                              val best4x3 = pickBestResolution(sizeList, 4f / 3f)
                              if (best16x9.width * best16x9.height > bestFront16x9Size.width * bestFront16x9Size.height) {
                                  bestFront16x9Size = best16x9
                              }
                              if (best4x3.width * best4x3.height > bestFront4x3Size.width * bestFront4x3Size.height) {
                                  bestFront4x3Size = best4x3
                              }
                          }
                      }

                      if (maxRearPixels > 0) {
                          rearSensorMp = max(12, (maxRearPixels / 1_000_000.0).roundToInt())
                      }
                      if (maxFrontPixels > 0) {
                          frontSensorMp = max(8, (maxFrontPixels / 1_000_000.0).roundToInt())
                      }

                      val backInfos = provider.availableCameraInfos.filter {
                          it.lensFacing == CameraSelector.LENS_FACING_BACK
                      }
                      discoveredRearLenses.clear()
                      val seenRatios = mutableListOf<Float>()

                      for (info in backInfos.sortedBy { it.intrinsicZoomRatio }) {
                          val rawRatio = info.intrinsicZoomRatio
                          val cleanRatio = (rawRatio * 10f).roundToInt() / 10f
                          if (seenRatios.any { abs(it - cleanRatio) < 0.15f }) continue
                          seenRatios.add(cleanRatio)

                          minZ = min(minZ, cleanRatio)
                          val roleKey = when {
                              cleanRatio < 0.9f -> "UW_${cleanRatio}"
                              cleanRatio > 1.5f -> "TELE_${cleanRatio}"
                              else -> "WIDE_${cleanRatio}"
                          }
                          val subName = when {
                              cleanRatio < 0.9f -> "UW"
                              cleanRatio > 1.5f -> "Tele"
                              else -> "Main"
                          }
                          discoveredRearLenses.add(
                              DiscoveredLens(
                                  key = roleKey,
                                  ratioLabel = formatZoomLabel(cleanRatio),
                                  subLabel = subName,
                                  targetZoom = cleanRatio,
                                  selector = info.cameraSelector
                              )
                          )
                      }

                      if (discoveredRearLenses.size <= 1) {
                          discoveredRearLenses.clear()
                          if (minZ < 0.9f) {
                              val uwVal = (minZ * 10f).roundToInt() / 10f
                              discoveredRearLenses.add(DiscoveredLens("UW", formatZoomLabel(uwVal), "UW", uwVal, logicalBackSelector))
                          }
                          discoveredRearLenses.add(DiscoveredLens("WIDE", "1x", "Main", 1.0f, logicalBackSelector))
                          if (maxZ >= 5.0f) {
                              discoveredRearLenses.add(DiscoveredLens("TELE", "5x", "Tele", 5.0f, logicalBackSelector))
                          } else if (maxZ >= 3.0f) {
                              discoveredRearLenses.add(DiscoveredLens("TELE", "3x", "Tele", 3.0f, logicalBackSelector))
                          }
                      }

                      deviceMinZoom = minZ.coerceIn(0.4f, 1.0f)
                      deviceMaxZoom = maxZ.coerceIn(2.0f, 30.0f)

                      val rawStops = mutableListOf<Float>()
                      if (deviceMinZoom < 0.92f) {
                          rawStops.add((deviceMinZoom * 10f).roundToInt() / 10f)
                      }
                      rawStops.add(1.0f)
                      if (deviceMaxZoom >= 2.0f) rawStops.add(2.0f)
                      for (lens in discoveredRearLenses) {
                          if (lens.targetZoom > 1.4f && lens.targetZoom <= deviceMaxZoom) {
                              rawStops.add(lens.targetZoom)
                          }
                      }
                      if (rawStops.none { it > 2.5f } && deviceMaxZoom >= 4.0f) {
                          rawStops.add(min(5.0f, deviceMaxZoom))
                      }
                      val topPreset = when {
                          deviceMaxZoom >= 10.0f -> 10.0f
                          deviceMaxZoom >= 8.0f -> 8.0f
                          else -> (deviceMaxZoom * 10f).roundToInt() / 10f
                      }
                      if (topPreset > 2.0f) rawStops.add(topPreset)

                      val uniqueStops = mutableListOf<Float>()
                      for (s in rawStops.sorted()) {
                          if (uniqueStops.none { abs(it - s) < 0.08f }) {
                              uniqueStops.add(s)
                          }
                      }
                      dynamicZoomStops = uniqueStops.take(6)
                      rebuildDynamicZoomAndLensUI()
                  } catch (ignored: Exception) {
                  }
              }

              private fun pickBestResolution(sizes: List<Size>, targetAspect: Float): Size {
                  if (sizes.isEmpty()) return Size(1920, 1080)
                  val matchingAspect = sizes.filter { s ->
                      val ratio = s.width.toFloat() / s.height.toFloat().coerceAtLeast(1f)
                      abs(ratio - targetAspect) < 0.12f
                  }
                  val pool = if (matchingAspect.isNotEmpty()) matchingAspect else sizes
                  var best = Size(1920, 1080)
                  var bestPx = 0L
                  for (s in pool) {
                      val px = s.width.toLong() * s.height.toLong()
                      if (px > bestPx) {
                          bestPx = px
                          best = s
                      }
                  }
                  return best
              }

              private fun switchPhysicalRearLens(lens: DiscoveredLens) {
                  selectedLensRole = lens.key
                  updateLensRoleCardsUI()
                  currentZoom = lens.targetZoom
                  bindDualCamerasSafely()
              }

              private fun resolveLensForZoom(zoomVal: Float): DiscoveredLens? {
                  if (discoveredRearLenses.isEmpty()) return null
                  val sorted = discoveredRearLenses.sortedBy { it.targetZoom }
                  var chosen = sorted.first()
                  for (lens in sorted) {
                      if (zoomVal >= lens.targetZoom * 0.92f) {
                          chosen = lens
                      }
                  }
                  return chosen
              }

              private fun setZoomSmooth(targetZoom: Float, fromPresetButton: Boolean) {
                  val clamped = targetZoom.coerceIn(deviceMinZoom, deviceMaxZoom)
                  currentZoom = clamped
                  updateZoomButtonsUI()

                  val activeOpticalLens = resolveLensForZoom(clamped)
                  if (activeOpticalLens != null && selectedLensRole != "AUTO") {
                      selectedLensRole = activeOpticalLens.key
                  }
                  updateLensRoleCardsUI()

                  val rounded1 = (clamped * 10f).roundToInt() / 10f
                  liveZoomNumberText.text = "${rounded1}x ZOOM"
                  val lensTag = when {
                      clamped < 0.95f -> "ULTRA-WIDE • ${rearSensorMp}MP • AF-C"
                      clamped >= 2.8f -> "TELEPHOTO • ${rearSensorMp}MP • AF-C"
                      else -> "WIDE • ${rearSensorMp}MP • AF-C"
                  }
                  liveZoomSensorText.text = lensTag
                  liveZoomHudBadge.animate().cancel()
                  liveZoomHudBadge.alpha = 1f
                  mainHandler.removeCallbacks(hideZoomHudRunnable)
                  mainHandler.postDelayed(hideZoomHudRunnable, 1600)

                  val eqMm = (24f * clamped).roundToInt()
                  polaroidExifText.text = "$deviceModelName • ${eqMm}mm f/1.7 • ${rearSensorMp}MP"

                  val cam = rearCamera
                  if (cam != null) {
                      val zoomState = cam.cameraInfo.zoomState.value
                      val minZ = zoomState?.minZoomRatio ?: 1.0f
                      val maxZ = zoomState?.maxZoomRatio ?: deviceMaxZoom

                      if (clamped >= minZ && clamped <= maxZ) {
                          cam.cameraControl.setZoomRatio(clamped)
                          previewRear.scaleX = 1.0f
                          previewRear.scaleY = 1.0f
                          updateLiveResolutionBadge()
                          return
                      }

                      if (activeOpticalLens != null && !isBindingCameras) {
                          val nextKey = if (fromPresetButton) activeOpticalLens.key else "AUTO"
                          if (selectedLensRole != nextKey) {
                              selectedLensRole = nextKey
                              updateLensRoleCardsUI()
                              bindDualCamerasSafely()
                              return
                          }
                      }

                      val hwZoom = clamped.coerceIn(minZ, maxZ)
                      cam.cameraControl.setZoomRatio(hwZoom)
                      val extraScale = (clamped / hwZoom).coerceIn(0.85f, 3.5f)
                      previewRear.scaleX = extraScale
                      previewRear.scaleY = extraScale
                      updateLiveResolutionBadge()
                  }
              }

              private fun updateZoomButtonsUI() {
                  for ((zVal, btn) in deckZoomButtons) {
                      val selected = abs(currentZoom - zVal) < 0.12f
                      if (selected) {
                          btn.setTextColor(Color.BLACK)
                          btn.background = circleDrawable("#FACC15")
                      } else {
                          btn.setTextColor(Color.WHITE)
                          btn.background = null
                      }
                  }
              }

              private fun updateLiveResolutionBadge() {
                  val rRes = rearPreviewUseCase?.resolutionInfo?.resolution
                  val fRes = if (frontCamera != null) frontPreviewUseCase?.resolutionInfo?.resolution else null
                  val rText = if (rRes != null) "R:${rRes.width}×${rRes.height}" else "R:${rearSensorMp}MP"
                  val fText = if (fRes != null) "F:${fRes.width}×${fRes.height}" else "F:${frontSensorMp}MP"
                  val modePrefix = if (proMaxResMode) "MAX • " else ""
                  resolutionTelemetryBadge.text = "$modePrefix$rText • $fText"
              }

              private fun applyFrontCameraLayout() {
                  val W = stageCard.width.takeIf { it > 0 } ?: (resources.displayMetrics.widthPixels - dp(16))
                  val H = stageCard.height.takeIf { it > 0 } ?: (resources.displayMetrics.heightPixels - dp(220))

                  val primaryContainer = if (swapSlots) frontContainer else rearContainer
                  val secondaryContainer = if (swapSlots) rearContainer else frontContainer

                  primaryContainer.elevation = 0f
                  secondaryContainer.elevation = dp(4).toFloat()

                  polaroidFooterBar.visibility = if (layoutMode == 5) View.VISIBLE else View.GONE
                  updateCreativeActionVisibility()

                  when (layoutMode) {
                      0, 1 -> {
                          stageCard.setBackgroundColor(Color.BLACK)
                          primaryContainer.layoutParams = FrameLayout.LayoutParams(W, H, Gravity.TOP or Gravity.START)
                          primaryContainer.clipToOutline = false
                          primaryContainer.background = null
                          primaryContainer.post {
                              primaryContainer.x = 0f
                              primaryContainer.y = 0f
                          }

                          val isCircle = (layoutMode == 1)
                          val baseW = (min(W, H) * (if (isCircle) 0.33f else 0.34f) * pipScale).toInt()
                          val baseH = if (isCircle) baseW else (baseW * 1.28f).toInt()

                          secondaryContainer.layoutParams = FrameLayout.LayoutParams(baseW, baseH, Gravity.TOP or Gravity.START)
                          secondaryContainer.background = pillDrawable("#000000", if (isCircle) 999 else 22, "#FFFFFFFF", 2)
                          secondaryContainer.clipToOutline = true
                          secondaryContainer.outlineProvider = object : ViewOutlineProvider() {
                              override fun getOutline(view: View, outline: Outline) {
                                  if (isCircle) {
                                      outline.setOval(0, 0, view.width, view.height)
                                  } else {
                                      outline.setRoundRect(0, 0, view.width, view.height, dp(22).toFloat())
                                  }
                              }
                          }
                          secondaryContainer.post {
                              if (hasCustomPipPos) {
                                  secondaryContainer.x = pipDragX
                                  secondaryContainer.y = pipDragY
                              } else {
                                  secondaryContainer.x = (W - baseW - dp(14)).toFloat()
                                  secondaryContainer.y = (H - baseH - dp(14)).toFloat()
                              }
                          }
                      }
                      2 -> {
                          stageCard.setBackgroundColor(Color.BLACK)
                          val splitH = (H * 0.68f).toInt()
                          primaryContainer.layoutParams = FrameLayout.LayoutParams(W, splitH, Gravity.TOP or Gravity.START)
                          secondaryContainer.layoutParams = FrameLayout.LayoutParams(W, H - splitH, Gravity.TOP or Gravity.START)
                          primaryContainer.clipToOutline = false
                          secondaryContainer.clipToOutline = false
                          primaryContainer.background = null
                          secondaryContainer.background = null
                          primaryContainer.post { primaryContainer.x = 0f; primaryContainer.y = 0f }
                          secondaryContainer.post { secondaryContainer.x = 0f; secondaryContainer.y = splitH.toFloat() }
                      }
                      3 -> {
                          stageCard.setBackgroundColor(Color.BLACK)
                          val halfH = H / 2
                          primaryContainer.layoutParams = FrameLayout.LayoutParams(W, halfH, Gravity.TOP or Gravity.START)
                          secondaryContainer.layoutParams = FrameLayout.LayoutParams(W, H - halfH, Gravity.TOP or Gravity.START)
                          primaryContainer.clipToOutline = false
                          secondaryContainer.clipToOutline = false
                          primaryContainer.background = null
                          secondaryContainer.background = null
                          primaryContainer.post { primaryContainer.x = 0f; primaryContainer.y = 0f }
                          secondaryContainer.post { secondaryContainer.x = 0f; secondaryContainer.y = halfH.toFloat() }
                      }
                      4 -> {
                          stageCard.setBackgroundColor(Color.BLACK)
                          val halfW = W / 2
                          primaryContainer.layoutParams = FrameLayout.LayoutParams(halfW, H, Gravity.TOP or Gravity.START)
                          secondaryContainer.layoutParams = FrameLayout.LayoutParams(W - halfW, H, Gravity.TOP or Gravity.START)
                          primaryContainer.clipToOutline = false
                          secondaryContainer.clipToOutline = false
                          primaryContainer.background = null
                          secondaryContainer.background = null
                          primaryContainer.post { primaryContainer.x = 0f; primaryContainer.y = 0f }
                          secondaryContainer.post { secondaryContainer.x = halfW.toFloat(); secondaryContainer.y = 0f }
                      }
                      5 -> {
                          stageCard.setBackgroundColor(Color.parseColor("#F8FAFC"))
                          val pad = dp(12)
                          val footerH = dp(56)
                          val availH = (H - footerH - pad * 3).coerceAtLeast(dp(120))
                          val slotH = availH / 2
                          val slotW = (W - pad * 2).coerceAtLeast(dp(100))

                          primaryContainer.layoutParams = FrameLayout.LayoutParams(slotW, slotH, Gravity.TOP or Gravity.START)
                          secondaryContainer.layoutParams = FrameLayout.LayoutParams(slotW, slotH, Gravity.TOP or Gravity.START)
                          primaryContainer.clipToOutline = true
                          secondaryContainer.clipToOutline = true
                          val roundedOutline = object : ViewOutlineProvider() {
                              override fun getOutline(view: View, outline: Outline) {
                                  outline.setRoundRect(0, 0, view.width, view.height, dp(10).toFloat())
                              }
                          }
                          primaryContainer.outlineProvider = roundedOutline
                          secondaryContainer.outlineProvider = roundedOutline
                          primaryContainer.post {
                              primaryContainer.x = pad.toFloat()
                              primaryContainer.y = pad.toFloat()
                          }
                          secondaryContainer.post {
                              secondaryContainer.x = pad.toFloat()
                              secondaryContainer.y = (pad * 2 + slotH).toFloat()
                          }
                      }
                  }
              }

              private fun buildHighResPreview(surfaceProvider: Preview.SurfaceProvider, preferBurstMax: Boolean, isFront: Boolean): Preview {
                  val aspectStrategy = if (proMaxResMode) {
                      AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY
                  } else {
                      AspectRatioStrategy.RATIO_16_9_FALLBACK_AUTO_STRATEGY
                  }
                  val targetSize = if (isFront) {
                      if (proMaxResMode) bestFront4x3Size else bestFront16x9Size
                  } else {
                      if (proMaxResMode) bestRear4x3Size else bestRear16x9Size
                  }
                  val resBuilder = ResolutionSelector.Builder()
                      .setAspectRatioStrategy(aspectStrategy)
                      .setResolutionStrategy(
                          ResolutionStrategy(
                              targetSize,
                              ResolutionStrategy.FALLBACK_RULE_CLOSEST_HIGHER_THEN_LOWER
                          )
                      )
                  if (preferBurstMax) {
                      resBuilder.setAllowedResolutionMode(ResolutionSelector.PREFER_HIGHER_RESOLUTION_OVER_CAPTURE_RATE)
                  }
                  val preview = Preview.Builder()
                      .setResolutionSelector(resBuilder.build())
                      .build()
                  preview.setSurfaceProvider(surfaceProvider)
                  if (isFront) frontPreviewUseCase = preview else rearPreviewUseCase = preview
                  return preview
              }

              private fun initializeCameraProvider() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      val provider = future.get()
                      cachedProvider = provider
                      discoverDeviceCameraProfile(provider)
                      val extFuture = ExtensionsManager.getInstanceAsync(this, provider)
                      extFuture.addListener({
                          try { cachedExtensions = extFuture.get() } catch (ignored: Exception) {}
                          bindDualCamerasSafely()
                      }, ContextCompat.getMainExecutor(this))
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun bindDualCamerasSafely() {
                  val cameraProvider = cachedProvider ?: return
                  if (isBindingCameras) return
                  isBindingCameras = true

                  try {
                      cameraProvider.unbindAll()

                      val matchedLens = discoveredRearLenses.firstOrNull { it.key == selectedLensRole }
                      val targetRearSelector: CameraSelector = matchedLens?.selector ?: logicalBackSelector

                      var concurrentBack: CameraSelector? = null
                      var concurrentFront: CameraSelector? = null

                      for (cameraInfos in cameraProvider.availableConcurrentCameraInfos) {
                          val backCandidate = cameraInfos.firstOrNull {
                              it.lensFacing == CameraSelector.LENS_FACING_BACK
                          }?.cameraSelector
                          val frontCandidate = cameraInfos.firstOrNull {
                              it.lensFacing == CameraSelector.LENS_FACING_FRONT
                          }?.cameraSelector
                          if (backCandidate != null && frontCandidate != null) {
                              concurrentBack = backCandidate
                              concurrentFront = frontCandidate
                              break
                          }
                      }

                      var boundSuccess = false

                      if (concurrentFront != null) {
                          for (allowHigherMode in listOf(true, false)) {
                              if (boundSuccess) break
                              try {
                                  val pRearHi = buildHighResPreview(previewRear.surfaceProvider, preferBurstMax = allowHigherMode, isFront = false)
                                  val pFrontHi = buildHighResPreview(previewFront.surfaceProvider, preferBurstMax = allowHigherMode, isFront = true)

                                  val primaryConfig = SingleCameraConfig(
                                      targetRearSelector,
                                      UseCaseGroup.Builder().addUseCase(pRearHi).build(),
                                      this
                                  )
                                  val secondaryConfig = SingleCameraConfig(
                                      concurrentFront,
                                      UseCaseGroup.Builder().addUseCase(pFrontHi).build(),
                                      this
                                  )
                                  val concurrent = cameraProvider.bindToLifecycle(listOf(primaryConfig, secondaryConfig))
                                  rearCamera = concurrent.cameras.firstOrNull {
                                      it.cameraInfo.lensFacing == CameraSelector.LENS_FACING_BACK
                                  } ?: concurrent.cameras.firstOrNull()
                                  frontCamera = concurrent.cameras.firstOrNull {
                                      it.cameraInfo.lensFacing == CameraSelector.LENS_FACING_FRONT
                                  }
                                  boundSuccess = true
                              } catch (ignored: Exception) {
                                  boundSuccess = false
                              }
                          }
                      }

                      if (!boundSuccess && concurrentBack != null && concurrentFront != null) {
                          try {
                              val pRearHi = buildHighResPreview(previewRear.surfaceProvider, preferBurstMax = false, isFront = false)
                              val pFrontHi = buildHighResPreview(previewFront.surfaceProvider, preferBurstMax = false, isFront = true)
                              val primaryConfig = SingleCameraConfig(
                                  concurrentBack,
                                  UseCaseGroup.Builder().addUseCase(pRearHi).build(),
                                  this
                              )
                              val secondaryConfig = SingleCameraConfig(
                                  concurrentFront,
                                  UseCaseGroup.Builder().addUseCase(pFrontHi).build(),
                                  this
                              )
                              val concurrent = cameraProvider.bindToLifecycle(listOf(primaryConfig, secondaryConfig))
                              rearCamera = concurrent.cameras.firstOrNull {
                                  it.cameraInfo.lensFacing == CameraSelector.LENS_FACING_BACK
                              } ?: concurrent.cameras.firstOrNull()
                              frontCamera = concurrent.cameras.firstOrNull {
                                  it.cameraInfo.lensFacing == CameraSelector.LENS_FACING_FRONT
                              }
                              boundSuccess = true
                          } catch (ignored: Exception) {
                              boundSuccess = false
                          }
                      }

                      if (!boundSuccess) {
                          val pRearMax = buildHighResPreview(previewRear.surfaceProvider, preferBurstMax = true, isFront = false)
                          rearCamera = cameraProvider.bindToLifecycle(this, targetRearSelector, pRearMax)
                      }

                      mainHandler.postDelayed({
                          setZoomSmooth(currentZoom, fromPresetButton = false)
                          updateLiveResolutionBadge()
                          if (stageCard.width > 0 && stageCard.height > 0) {
                              triggerTapToFocus(stageCard.width / 2f, stageCard.height / 2f, focusFront = false)
                          }
                      }, 180)
                  } catch (ignored: Exception) {
                  } finally {
                      isBindingCameras = false
                  }
              }

              private fun triggerPixelShutterSequence(shutterDisc: View) {
                  if (isCapturingPhoto) return
                  shutterDisc.performHapticFeedback(HapticFeedbackConstants.CONFIRM)
                  shutterDisc.animate().scaleX(0.84f).scaleY(0.84f).setDuration(55).withEndAction {
                      shutterDisc.animate().scaleX(1f).scaleY(1f).setDuration(100).start()
                  }.start()

                  if (captureMode == 1 && !isTopHalfFrozen) {
                      toggleFreezeTopHalf()
                      return
                  }

                  if (timerSeconds <= 0) {
                      executeImmediateCapture()
                  } else {
                      var remaining = timerSeconds
                      countdownLabel.visibility = View.VISIBLE
                      countdownLabel.text = remaining.toString()

                      val tick = object : Runnable {
                          override fun run() {
                              remaining -= 1
                              if (remaining > 0) {
                                  countdownLabel.text = remaining.toString()
                                  countdownLabel.scaleX = 1.25f
                                  countdownLabel.scaleY = 1.25f
                                  countdownLabel.animate().scaleX(1f).scaleY(1f).setDuration(200).start()
                                  mainHandler.postDelayed(this, 1000)
                              } else {
                                  countdownLabel.visibility = View.GONE
                                  executeImmediateCapture()
                              }
                          }
                      }
                      mainHandler.postDelayed(tick, 1000)
                  }
              }

              private fun executeImmediateCapture() {
                  isCapturingPhoto = true
                  shutterSound.play(MediaActionSound.SHUTTER_CLICK)

                  flashOverlay.alpha = 0.90f
                  flashOverlay.animate().alpha(0f).setDuration(180).start()

                  val rearBmp = if (isTopHalfFrozen && frozenTopBitmap != null) frozenTopBitmap else previewRear.bitmap
                  val frontBmp = previewFront.bitmap

                  if (captureMode == 2) {
                      captureBurstQuadToGallery(rearBmp, frontBmp)
                      return
                  }

                  captureDualCompositeToGallery(rearBmp, frontBmp)
                  if (isTopHalfFrozen) {
                      clearFrozenTopHalf()
                  }
              }

              private fun captureBurstQuadToGallery(firstRear: Bitmap?, firstFront: Bitmap?) {
                  val frames = mutableListOf<Bitmap>()
                  val burstPaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
                  val snapSingle: (Bitmap?, Bitmap?) -> Bitmap = { r, f ->
                      val w = 720
                      val h = 960
                      val b = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                      val c = Canvas(b)
                      if (r != null) {
                          c.drawBitmap(r, null, RectF(0f, 0f, w.toFloat(), h / 2f), burstPaint)
                      }
                      if (f != null) {
                          c.drawBitmap(f, null, RectF(0f, h / 2f, w.toFloat(), h.toFloat()), burstPaint)
                      }
                      b
                  }
                  frames.add(snapSingle(firstRear, firstFront))

                  var taken = 1
                  val burstRunner = object : Runnable {
                      override fun run() {
                          shutterSound.play(MediaActionSound.SHUTTER_CLICK)
                          frames.add(snapSingle(previewRear.bitmap, previewFront.bitmap))
                          taken += 1
                          if (taken < 4) {
                              mainHandler.postDelayed(this, 220L)
                          } else {
                              val gridBmp = Bitmap.createBitmap(1460, 1940, Bitmap.Config.ARGB_8888)
                              val gc = Canvas(gridBmp)
                              gc.drawColor(Color.parseColor("#F8FAFC"))
                              val coords = listOf(
                                  RectF(10f, 10f, 725f, 965f),
                                  RectF(735f, 10f, 1450f, 965f),
                                  RectF(10f, 975f, 725f, 1930f),
                                  RectF(735f, 975f, 1450f, 1930f)
                              )
                              for (i in 0 until min(4, frames.size)) {
                                  gc.drawBitmap(frames[i], null, coords[i], burstPaint)
                              }
                              lastCapturedBitmap = gridBmp
                              thumbView.setImageBitmap(gridBmp)
                              captureCount += 1
                              photoCountBadge.text = captureCount.toString()
                              photoCountBadge.visibility = View.VISIBLE
                              saveBitmapAsync(gridBmp, "Burst4x")
                          }
                      }
                  }
                  mainHandler.postDelayed(burstRunner, 220L)
              }

              private fun captureDualCompositeToGallery(rearBmp: Bitmap?, frontBmp: Bitmap?) {
                  try {
                      if (rearBmp == null && frontBmp == null) {
                          isCapturingPhoto = false
                          Toast.makeText(this, "Camera sensors warming up...", Toast.LENGTH_SHORT).show()
                          return
                      }

                      val displayW = resources.displayMetrics.widthPixels.coerceAtLeast(1080)
                      val stageW = stageCard.width.takeIf { it > 0 } ?: displayW
                      val stageH = stageCard.height.takeIf { it > 0 } ?: resources.displayMetrics.heightPixels
                      val targetOutWidth = max(displayW, bestRear16x9Size.height).coerceIn(1080, 2560)
                      val scaleFactor = max(1.0f, targetOutWidth.toFloat() / stageW.toFloat())
                      val outW = (stageW * scaleFactor).toInt()
                      val outH = (stageH * scaleFactor).toInt()

                      val combined = Bitmap.createBitmap(outW, outH, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(combined)
                      canvas.drawColor(if (layoutMode == 5) Color.parseColor("#F8FAFC") else Color.BLACK)

                      val rearPaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG or Paint.DITHER_FLAG).apply {
                          if (rearLookIndex != 0) colorFilter = ColorMatrixColorFilter(getColorMatrixForLook(rearLookIndex))
                      }
                      val frontPaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG or Paint.DITHER_FLAG).apply {
                          if (frontLookIndex != 0) colorFilter = ColorMatrixColorFilter(getColorMatrixForLook(frontLookIndex))
                      }

                      val primaryContainer = if (swapSlots) frontContainer else rearContainer
                      val secondaryContainer = if (swapSlots) rearContainer else frontContainer
                      val primaryBmp = if (swapSlots) frontBmp else rearBmp
                      val secondaryBmp = if (swapSlots) rearBmp else frontBmp
                      val primaryPaint = if (swapSlots) frontPaint else rearPaint
                      val secondaryPaint = if (swapSlots) rearPaint else frontPaint

                      primaryBmp?.let { bmp ->
                          val dst = RectF(
                              primaryContainer.x * scaleFactor,
                              primaryContainer.y * scaleFactor,
                              (primaryContainer.x + primaryContainer.width) * scaleFactor,
                              (primaryContainer.y + primaryContainer.height) * scaleFactor
                          )
                          canvas.drawBitmap(bmp, null, dst, primaryPaint)
                      }

                      secondaryBmp?.let { bmp ->
                          val sx = secondaryContainer.x * scaleFactor
                          val sy = secondaryContainer.y * scaleFactor
                          val sw = secondaryContainer.width * scaleFactor
                          val sh = secondaryContainer.height * scaleFactor
                          val dst = RectF(sx, sy, sx + sw, sy + sh)
                          val cornerRad = dp(22) * scaleFactor

                          canvas.save()
                          val clipPath = Path()
                          if (layoutMode == 1) {
                              clipPath.addOval(dst, Path.Direction.CW)
                              canvas.clipPath(clipPath)
                          } else if (layoutMode == 0) {
                              clipPath.addRoundRect(dst, cornerRad, cornerRad, Path.Direction.CW)
                              canvas.clipPath(clipPath)
                          }
                          canvas.drawBitmap(bmp, null, dst, secondaryPaint)
                          canvas.restore()

                          if (layoutMode == 0 || layoutMode == 1) {
                              val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                                  style = Paint.Style.STROKE
                                  setColor(Color.WHITE)
                                  strokeWidth = dp(2) * scaleFactor
                              }
                              if (layoutMode == 1) {
                                  canvas.drawOval(dst, borderPaint)
                              } else {
                                  canvas.drawRoundRect(dst, cornerRad, cornerRad, borderPaint)
                              }
                          }
                      }

                      if (layoutMode == 5) {
                          val footerTop = (stageH - dp(56)) * scaleFactor
                          val exifPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              setColor(Color.parseColor("#334155"))
                              textSize = dp(11) * scaleFactor
                              typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                              textAlign = Paint.Align.CENTER
                          }
                          val capPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              setColor(Color.parseColor("#0F172A"))
                              textSize = dp(13) * scaleFactor
                              typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                              textAlign = Paint.Align.CENTER
                          }
                          val dateStr = SimpleDateFormat("MMM d, yyyy • HH:mm", Locale.US).format(Date())
                          val eqMm = (24f * currentZoom).roundToInt()
                          canvas.drawText("$deviceModelName • ${eqMm}mm f/1.7 • $dateStr", outW / 2f, footerTop + dp(20) * scaleFactor, exifPaint)
                          canvas.drawText(customCaption, outW / 2f, footerTop + dp(40) * scaleFactor, capPaint)
                      }

                      lastCapturedBitmap = combined
                      captureCount += 1
                      photoCountBadge.text = captureCount.toString()
                      photoCountBadge.visibility = View.VISIBLE
                      thumbView.setImageBitmap(combined)
                      thumbView.scaleX = 0.25f
                      thumbView.scaleY = 0.25f
                      thumbView.animate().scaleX(1f).scaleY(1f).setDuration(200).start()

                      saveBitmapAsync(combined, "DualSight", if (tripleSaveEnabled) rearBmp else null, if (tripleSaveEnabled) frontBmp else null)
                  } catch (ignored: Exception) {
                      isCapturingPhoto = false
                  }
              }

              private fun saveBitmapAsync(mainBmp: Bitmap, prefix: String, cleanRear: Bitmap? = null, cleanFront: Bitmap? = null) {
                  val safeModel = deviceModelName.replace(Regex("[^A-Za-z0-9]"), "")
                  val ts = System.currentTimeMillis()
                  ioExecutor.execute {
                      try {
                          val uri = writeJpegToMediaStore(mainBmp, "${safeModel}_${prefix}_$ts.jpg")
                          if (cleanRear != null) {
                              writeJpegToMediaStore(cleanRear, "${safeModel}_Rear_${ts}.jpg")
                          }
                          if (cleanFront != null) {
                              writeJpegToMediaStore(cleanFront, "${safeModel}_Front_${ts}.jpg")
                          }
                          mainHandler.post {
                              if (uri != null) {
                                  lastSavedUri = uri
                                  val msg = if (cleanRear != null) "3x Saved (Composite + Rear + Front)" else "Saved ${mainBmp.width}×${mainBmp.height}"
                                  Toast.makeText(this@MainActivity, msg, Toast.LENGTH_SHORT).show()
                              }
                          }
                      } catch (ignored: Exception) {
                      } finally {
                          mainHandler.post { isCapturingPhoto = false }
                      }
                  }
              }

              private fun writeJpegToMediaStore(bmp: Bitmap, fileName: String): Uri? {
                  val values = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, fileName)
                      put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                      put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/DualSightPro")
                  }
                  val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                  if (uri != null) {
                      contentResolver.openOutputStream(uri)?.use { out ->
                          bmp.compress(Bitmap.CompressFormat.JPEG, 100, out)
                      }
                  }
                  return uri
              }

              private fun computeFastLuminanceBins(bmp: Bitmap): FloatArray {
                  val bins = IntArray(32)
                  val stepX = max(1, bmp.width / 24)
                  val stepY = max(1, bmp.height / 24)
                  var y = 0
                  while (y < bmp.height) {
                      var x = 0
                      while (x < bmp.width) {
                          val c = bmp.getPixel(x, y)
                          val r = (c shr 16) and 0xFF
                          val g = (c shr 8) and 0xFF
                          val b = c and 0xFF
                          val lum = ((r * 77 + g * 150 + b * 29) shr 8).coerceIn(0, 255)
                          bins[lum shr 3] += 1
                          x += stepX
                      }
                      y += stepY
                  }
                  var maxBin = 1
                  for (bVal in bins) {
                      if (bVal > maxBin) maxBin = bVal
                  }
                  return FloatArray(32) { i -> bins[i].toFloat() / maxBin.toFloat() }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  shutterSound.release()
                  ioExecutor.shutdown()
              }

              private class GridOverlayView(context: Context) : View(context) {
                  private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      setColor(Color.parseColor("#44FFFFFF"))
                      strokeWidth = 2f
                      style = Paint.Style.STROKE
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val w = width.toFloat()
                      val h = height.toFloat()
                      canvas.drawLine(w / 3f, 0f, w / 3f, h, linePaint)
                      canvas.drawLine(w * 2f / 3f, 0f, w * 2f / 3f, h, linePaint)
                      canvas.drawLine(0f, h / 3f, w, h / 3f, linePaint)
                      canvas.drawLine(0f, h * 2f / 3f, w, h * 2f / 3f, linePaint)
                  }
              }

              private class SpiritLevelView(context: Context) : View(context) {
                  private var angleDeg: Float = 0f
                  private val barPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      strokeWidth = 5f
                      style = Paint.Style.STROKE
                      strokeCap = Paint.Cap.ROUND
                  }
                  private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      setColor(Color.WHITE)
                      textSize = 26f
                      typeface = Typeface.MONOSPACE
                      textAlign = Paint.Align.LEFT
                  }

                  fun updateAngle(deg: Float) {
                      angleDeg = deg
                      invalidate()
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val cx = width / 2f
                      val cy = height / 2f
                      val halfLen = min(width, height) * 0.24f
                      val isLevel = abs(angleDeg) < 1.2f
                      barPaint.setColor(if (isLevel) Color.parseColor("#34D399") else Color.parseColor("#88FACC15"))

                      canvas.save()
                      canvas.rotate(-angleDeg.coerceIn(-45f, 45f), cx, cy)
                      canvas.drawLine(cx - halfLen, cy, cx + halfLen, cy, barPaint)
                      canvas.restore()

                      val label = String.format(Locale.US, "%.1f°", abs(angleDeg))
                      canvas.drawText(label, cx + halfLen + 18f, cy + 8f, textPaint)
                  }
              }

              private class HistogramView(context: Context) : View(context) {
                  private var currentBins = FloatArray(32) { 0.2f }
                  private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      setColor(Color.parseColor("#8811131C"))
                      style = Paint.Style.FILL
                  }
                  private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      setColor(Color.parseColor("#99FACC15"))
                      style = Paint.Style.FILL
                  }
                  private val strokePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      setColor(Color.parseColor("#44FFFFFF"))
                      style = Paint.Style.STROKE
                      strokeWidth = 2f
                  }

                  fun updateBins(newBins: FloatArray) {
                      currentBins = newBins
                      invalidate()
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val w = width.toFloat()
                      val h = height.toFloat()
                      val rect = RectF(0f, 0f, w, h)
                      canvas.drawRoundRect(rect, 18f, 18f, bgPaint)
                      canvas.drawRoundRect(rect, 18f, 18f, strokePaint)

                      val path = Path()
                      path.moveTo(6f, h - 6f)
                      val stepX = (w - 12f) / 31f
                      for (i in 0 until 32) {
                          val x = 6f + i * stepX
                          val y = (h - 6f) - (currentBins[i].coerceIn(0f, 1f) * (h - 14f))
                          path.lineTo(x, y)
                      }
                      path.lineTo(w - 6f, h - 6f)
                      path.close()
                      canvas.drawPath(path, fillPaint)
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Android APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Pixel11-DualSight.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel11-DualSight-APK
          path: Pixel11-DualSight.apk

      - name: Publish Direct Download APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v8.0.${{ github.run_number }}" Pixel11-DualSight.apk \
            --title "Dual Sight Pro APK (Build #${{ github.run_number }})" \
            --notes "Tap **Pixel11-DualSight.apk** under Assets below to download and install directly on your Android device."
