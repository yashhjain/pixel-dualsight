              private fun applyExposureOffset(stepDelta: Int) {
                  val cam = rearCamera ?: return
                  val expState = cam.cameraInfo.exposureState
                  if (!expState.isExposureCompensationSupported) return
                  val range: Range<Int> = expState.exposureCompensationRange
                  val minIdx: Int = range.lower ?: -6
                  val maxIdx: Int = range.upper ?: 6
                  val targetIdx: Int = min(maxIdx, max(minIdx, stepDelta))
                  cam.cameraControl.setExposureCompensationIndex(targetIdx)
                  val stepRat: Rational = expState.exposureCompensationStep
                  val num: Float = stepRat.numerator.toFloat()
                  val den: Float = max(1f, stepRat.denominator.toFloat())
                  val stepVal: Float = (num / den) * targetIdx.toFloat()
                  val sign = if (stepVal >= 0f) "+" else ""
                  evValueLabel.text = String.format(Locale.US, "EV %s%.1f", sign, stepVal)
              }

