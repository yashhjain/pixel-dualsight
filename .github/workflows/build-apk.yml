                  shutterOuterRing.addView(shutterInnerDisc, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))
                  shutterOuterRing.setOnClickListener {
                      triggerPixelShutterSequence(shutterInnerDisc)
                  }

                  // "Swap" Pill Button (Locked to Gravity.END | Gravity.CENTER_VERTICAL)
                  val btnSwapCams = TextView(this).apply {
