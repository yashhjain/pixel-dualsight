              private fun updateModeStripUI() {
                  for ((mIdx, tab) in modeTabs) {
                      if (mIdx == captureMode) {
                          tab.setTextColor(Color.parseColor("#FACC15"))
                          tab.setTypeface(Typeface.create("sans-serif-medium", Typeface.BOLD))
                          tab.background = pillDrawable("#26FACC15", 14)
                      } else {
                          tab.setTextColor(Color.parseColor("#94A3B8"))
                          tab.typeface = Typeface.create("sans-serif", Typeface.NORMAL)
                          tab.background = null
                      }
                  }
              }

              private fun updateCreativeActionVisibility() {
                  val showCreativeBar = (captureMode == 1 || layoutMode == 5 || isTopHalfFrozen)
                  creativeActionRow.visibility = if (showCreativeBar) View.VISIBLE else View.GONE
              }

              private fun toggleFreezeTopHalf() {
                  if (!isTopHalfFrozen) {
                      val bmp = previewRear.bitmap
                      if (bmp != null) {
                          frozenTopBitmap = bmp
