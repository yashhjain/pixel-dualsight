              private fun rebuildDynamicZoomAndLensUI() {
                  zoomCapsuleLayout.removeAllViews()
                  deckZoomButtons.clear()

                  val isLandscape = (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE)

                  for (zVal in dynamicZoomStops) {
                      val btn = TextView(this).apply {
                          text = formatZoomLabel(zVal)
                          gravity = Gravity.CENTER
                          textSize = 11.5f
                          typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              setZoomSmooth(zVal, fromPresetButton = true)
                          }
                      }
                      deckZoomButtons[zVal] = btn
                      if (isLandscape) {
                          zoomCapsuleLayout.addView(btn, LinearLayout.LayoutParams(dp(42), dp(30)).apply {
                              topMargin = dp(2)
                              bottomMargin = dp(2)
                          })
                      } else {
                          zoomCapsuleLayout.addView(btn, LinearLayout.LayoutParams(dp(44), dp(34)).apply {
                              leftMargin = dp(2)
                              rightMargin = dp(2)
                          })
                      }
                  }
                  updateZoomButtonsUI()

                  lensCardsRowLayout.removeAllViews()
                  lensRoleCards.clear()
                  lensRoleTopTexts.clear()
                  lensRoleSubTexts.clear()

                  val lensCount = max(1, discoveredRearLenses.size)
                  val cardsToBuild = mutableListOf(
                      DiscoveredLens("AUTO", "Auto", if (lensCount > 1) "${lensCount}-Lens" else "${rearSensorMp}MP", 1.0f, logicalBackSelector)
                  )
                  cardsToBuild.addAll(discoveredRearLenses)

                  for (lens in cardsToBuild) {
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          setPadding(dp(10), dp(4), dp(10), dp(4))
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                              switchPhysicalRearLens(lens)
                          }
                      }
                      val topTv = TextView(this).apply {
                          text = lens.ratioLabel
                          textSize = 11.5f
                          gravity = Gravity.CENTER
                          typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      }
                      val subTv = TextView(this).apply {
                          text = lens.subLabel
                          textSize = 9.5f
                          gravity = Gravity.CENTER
                      }
                      card.addView(topTv)
                      card.addView(subTv)
                      lensRoleCards[lens.key] = card
                      lensRoleTopTexts[lens.key] = topTv
                      lensRoleSubTexts[lens.key] = subTv

                      lensCardsRowLayout.addView(card, LinearLayout.LayoutParams(dp(70), dp(42)).apply {
                          leftMargin = dp(3)
                          rightMargin = dp(3)
                      })
                  }
                  updateLensRoleCardsUI()
              }

