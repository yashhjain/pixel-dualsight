name: Build Pixel 11 Dual Sight APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Android CameraX Project Files
        run: |
          mkdir -p app/src/main/java/com/pixel11/dualsight

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Pixel11DualSight"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pixel11.dualsight"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.pixel11.dualsight"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              val cameraxVersion = "1.4.0"
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.camera:camera-core:$cameraxVersion")
              implementation("androidx.camera:camera-camera2:$cameraxVersion")
              implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
              implementation("androidx.camera:camera-view:$cameraxVersion")
              implementation("androidx.camera:camera-extensions:$cameraxVersion")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.camera.any" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-feature android:name="android.hardware.camera.concurrent" android:required="false" />
              <uses-permission android:name="android.permission.CAMERA" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Pixel 11 Dual Sight"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:colorMode="hdr"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/pixel11/dualsight/MainActivity.kt
          package com.pixel11.dualsight

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.Outline
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.RenderEffect
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaActionSound
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.MediaStore
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.ViewOutlineProvider
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ConcurrentCamera.SingleCameraConfig
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.Preview
          import androidx.camera.core.UseCaseGroup
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import kotlin.math.abs
          import kotlin.math.min

          class MainActivity : AppCompatActivity() {

              private lateinit var stageCard: FrameLayout
              private lateinit var rearContainer: FrameLayout
              private lateinit var frontContainer: FrameLayout
              private lateinit var previewRear: PreviewView
              private lateinit var previewFront: PreviewView
              private lateinit var gridOverlayView: GridOverlayView
              private lateinit var focusRingView: FrameLayout
              private lateinit var flashOverlay: View
              private lateinit var countdownLabel: TextView
              private lateinit var thumbView: ImageView
              private lateinit var photoCountBadge: TextView
              private lateinit var rearSensorBadge: TextView
              private lateinit var afStatusBadge: TextView
              private lateinit var zoomTextBadge: TextView
              private lateinit var zoomSeekBar: SeekBar
              private lateinit var btnPipSizeChip: TextView
              private lateinit var btnFlashChip: TextView
              private lateinit var btnTimerChip: TextView
              private lateinit var btnGridChip: TextView

              private val deckZoomButtons = mutableMapOf<Float, TextView>()
              private val lensRoleChips = mutableMapOf<String, TextView>()
              private val layoutChips = mutableListOf<TextView>()
              private val lookChips = mutableListOf<TextView>()

              private var cachedProvider: ProcessCameraProvider? = null
              private var rearCamera: Camera? = null
              private var frontCamera: Camera? = null
              private var isBindingCameras = false
              private var isCapturingPhoto = false

              // Pixel 11 Pro XL Triple Rear Camera Selectors discovered via stable CameraInfo.intrinsicZoomRatio
              private var logicalBackSelector: CameraSelector = CameraSelector.DEFAULT_BACK_CAMERA
              private var ultraWideSelector: CameraSelector? = null
              private var mainWideSelector: CameraSelector? = null
              private var telephotoSelector: CameraSelector? = null
              private var selectedLensRole: String = "AUTO" // "AUTO", "UW", "WIDE", "TELE"

              private var currentZoom = 1.0f
              private var lastZoomApplyMs = 0L
              private var swapSlots = false
              private var torchEnabled = false
              private var gridEnabled = false
              private var timerSeconds = 0
              private var captureCount = 0
              private var lastSavedUri: Uri? = null

              private val shutterSound = MediaActionSound()
              private val mainHandler = Handler(Looper.getMainLooper())
              private val ioExecutor = Executors.newSingleThreadExecutor()

              // 0 = PiP Card, 1 = Circle Bubble, 2 = 70/30 Split, 3 = 50/50 Split, 4 = Left/Right
              private var layoutMode = 0
              private val layoutLabels = listOf("PiP Card", "Circle", "70/30 Split", "50/50 Split", "Left/Right")
              private var pipScale = 1.0f

              // 6 Real-Time GPU Color Look Filters
              private var lookIndex = 0
              private val lookLabels = listOf("Natural", "Vivid Pop", "Golden Hour", "Cyber Teal", "Leica Mono", "Vintage")

              private var pipDragX = 0f
              private var pipDragY = 0f
              private var hasCustomPipPos = false

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  if (granted) initializeCameraProvider()
                  else Toast.makeText(this, "Camera permission is required", Toast.LENGTH_LONG).show()
              }

              private fun dp(value: Int): Int =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value.toFloat(), resources.displayMetrics).toInt()

              private fun pillDrawable(fillHex: String, radiusDp: Int, strokeHex: String? = null, strokeDp: Int = 0): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor(fillHex))
                      cornerRadius = dp(radiusDp).toFloat()
                      if (strokeHex != null && strokeDp > 0) {
                          setStroke(dp(strokeDp), Color.parseColor(strokeHex))
                      }
                  }
              }

              private fun circleDrawable(fillHex: String, strokeHex: String? = null, strokeDp: Int = 0): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(Color.parseColor(fillHex))
                      if (strokeHex != null && strokeDp > 0) {
                          setStroke(dp(strokeDp), Color.parseColor(strokeHex))
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#07080C")
                  window.navigationBarColor = Color.parseColor("#07080C")
                  shutterSound.load(MediaActionSound.SHUTTER_CLICK)
                  shutterSound.load(MediaActionSound.FOCUS_COMPLETE)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#07080C"))
                      setPadding(dp(8), dp(6), dp(8), dp(8))
                  }

                  // 1. TOP UTILITY BAR (Torch, Timer, Grid, PiP Size)
                  val topHud = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = pillDrawable("#141722", 22, "#24FFFFFF", 1)
                      setPadding(dp(10), dp(6), dp(10), dp(6))
                  }

                  val brandTitle = TextView(this).apply {
                      text = "PIXEL 11 PRO XL"
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                  }

                  btnFlashChip = buildTopUtilityChip("⚡ Off") {
                      torchEnabled = !torchEnabled
                      rearCamera?.cameraControl?.enableTorch(torchEnabled)
                      btnFlashChip.text = if (torchEnabled) "⚡ On" else "⚡ Off"
                      btnFlashChip.background = if (torchEnabled) pillDrawable("#F59E0B", 14) else pillDrawable("#222634", 14)
                      btnFlashChip.setTextColor(if (torchEnabled) Color.BLACK else Color.WHITE)
                  }

                  btnTimerChip = buildTopUtilityChip("⏱ Off") {
                      timerSeconds = when (timerSeconds) {
                          0 -> 3
                          3 -> 5
                          else -> 0
                      }
                      btnTimerChip.text = if (timerSeconds == 0) "⏱ Off" else "⏱ ${timerSeconds}s"
                      btnTimerChip.background = if (timerSeconds > 0) pillDrawable("#3B82F6", 14) else pillDrawable("#222634", 14)
                  }

                  btnGridChip = buildTopUtilityChip("# Grid") {
                      gridEnabled = !gridEnabled
                      gridOverlayView.visibility = if (gridEnabled) View.VISIBLE else View.GONE
                      btnGridChip.background = if (gridEnabled) pillDrawable("#3B82F6", 14) else pillDrawable("#222634", 14)
                  }

                  btnPipSizeChip = buildTopUtilityChip("PiP: M") {
                      pipScale = when {
                          pipScale == 1.0f -> 1.28f
                          pipScale > 1.0f -> 0.76f
                          else -> 1.0f
                      }
                      val sizeTag = when {
                          pipScale > 1.0f -> "L"
                          pipScale < 1.0f -> "S"
                          else -> "M"
                      }
                      btnPipSizeChip.text = "PiP: $sizeTag"
                      applyFrontCameraLayout()
                  }

                  topHud.addView(brandTitle, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  topHud.addView(btnFlashChip, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(28)).apply { rightMargin = dp(5) })
                  topHud.addView(btnTimerChip, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(28)).apply { rightMargin = dp(5) })
                  topHud.addView(btnGridChip, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(28)).apply { rightMargin = dp(5) })
                  topHud.addView(btnPipSizeChip, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(28)))

                  root.addView(topHud, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = dp(6)
                  })

                  // 2. VIEWFINDER STAGE (Rounded 24dp with strict elevation ordering)
                  stageCard = FrameLayout(this).apply {
                      background = pillDrawable("#000000", 24, "#29FFFFFF", 1)
                      clipChildren = true
                      clipToPadding = true
                      clipToOutline = true
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, dp(24).toFloat())
                          }
                      }
                  }

                  rearContainer = FrameLayout(this).apply {
                      clipChildren = true
                      clipToPadding = true
                      elevation = 0f
                  }
                  frontContainer = FrameLayout(this).apply {
                      clipChildren = true
                      clipToPadding = true
                      elevation = dp(4).toFloat()
                  }

                  previewRear = PreviewView(this).apply {
                      implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                      scaleType = PreviewView.ScaleType.FILL_CENTER
                  }
                  previewFront = PreviewView(this).apply {
                      implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                      scaleType = PreviewView.ScaleType.FILL_CENTER
                  }

                  rearContainer.addView(previewRear, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))
                  frontContainer.addView(previewFront, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  stageCard.addView(rearContainer)
                  stageCard.addView(frontContainer)

                  // 3x3 Rule-of-Thirds Grid Overlay (elevation = 12dp)
                  gridOverlayView = GridOverlayView(this).apply {
                      visibility = View.GONE
                      elevation = dp(12).toFloat()
                  }
                  stageCard.addView(gridOverlayView, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  // Tap-to-Focus Active Gold Reticle (elevation = 22dp so it is always visible above PreviewView)
                  focusRingView = FrameLayout(this).apply {
                      background = circleDrawable("#22FACC15", "#FACC15", 2)
                      alpha = 0f
                      elevation = dp(22).toFloat()
                      val centerDot = View(this@MainActivity).apply {
                          background = circleDrawable("#FDE047")
                      }
                      addView(centerDot, FrameLayout.LayoutParams(dp(10), dp(10), Gravity.CENTER))
                  }
                  stageCard.addView(focusRingView, FrameLayout.LayoutParams(dp(72), dp(72)))

                  // Top Telemetry Badges inside Viewfinder (elevation = 24dp)
                  val lensBadgesRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(12), dp(10), dp(12), dp(6))
                      elevation = dp(24).toFloat()
                  }

                  rearSensorBadge = TextView(this).apply {
                      text = "● 1x WIDE 50MP"
                      setTextColor(Color.parseColor("#A7F3D0"))
                      textSize = 10.5f
                      typeface = Typeface.MONOSPACE
                      background = pillDrawable("#B3090A0F", 12, "#33FFFFFF", 1)
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                  }

                  afStatusBadge = TextView(this).apply {
                      text = "● AF-C ACTIVE"
                      setTextColor(Color.parseColor("#93C5FD"))
                      textSize = 10.5f
                      typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                      background = pillDrawable("#B3090A0F", 12, "#3393C5FD", 1)
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                      setOnClickListener {
                          triggerTapToFocus(stageCard.width / 2f, stageCard.height / 2f)
                      }
                  }

                  zoomTextBadge = TextView(this).apply {
                      text = "1.0x"
                      setTextColor(Color.parseColor("#FDE047"))
                      textSize = 11f
                      typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                      background = pillDrawable("#B3090A0F", 12, "#44FDE047", 1)
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                  }

                  lensBadgesRow.addView(rearSensorBadge)
                  lensBadgesRow.addView(View(this), LinearLayout.LayoutParams(dp(6), 1))
                  lensBadgesRow.addView(afStatusBadge)
                  lensBadgesRow.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                  lensBadgesRow.addView(zoomTextBadge)
                  stageCard.addView(lensBadgesRow, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.TOP))

                  // Countdown Overlay (elevation = 28dp)
                  countdownLabel = TextView(this).apply {
                      text = "3"
                      textSize = 68f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.create("sans-serif-black", Typeface.BOLD)
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                      elevation = dp(28).toFloat()
                  }
                  stageCard.addView(countdownLabel, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  // Shutter Flash Overlay (elevation = 30dp)
                  flashOverlay = View(this).apply {
                      background = pillDrawable("#FFFFFF", 24, "#3B82F6", 6)
                      alpha = 0f
                      isClickable = false
                      elevation = dp(30).toFloat()
                  }
                  stageCard.addView(flashOverlay, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  root.addView(stageCard, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))

                  // 3. DEDICATED BOTTOM CONTROL DECK (Always visible, never covered by SurfaceView/TextureView)
                  val bottomDeck = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = pillDrawable("#11131C", 26, "#22FFFFFF", 1)
                      setPadding(dp(10), dp(8), dp(10), dp(10))
                  }

                  // ROW 1: DEDICATED ZOOM SELECTION BAR (0.5x | 1x | 2x | 5x | 10x)
                  val zoomRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = pillDrawable("#181B28", 22, "#28FFFFFF", 1)
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                  }

                  val zoomTitle = TextView(this).apply {
                      text = "ZOOM"
                      textSize = 10f
                      setTextColor(Color.parseColor("#FACC15"))
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      setPadding(dp(4), 0, dp(6), 0)
                  }
                  zoomRow.addView(zoomTitle)

                  val zoomPresets = listOf(0.5f to "0.5x", 1.0f to "1x", 2.0f to "2x", 5.0f to "5x", 10.0f to "10x")
                  for ((zVal, zLabel) in zoomPresets) {
                      val btn = TextView(this).apply {
                          text = zLabel
                          gravity = Gravity.CENTER
                          textSize = 11.5f
                          typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              setZoomSmooth(zVal, fromPresetButton = true)
                          }
                      }
                      deckZoomButtons[zVal] = btn
                      zoomRow.addView(btn, LinearLayout.LayoutParams(0, dp(32), 1f).apply {
                          leftMargin = dp(2)
                          rightMargin = dp(2)
                      })
                  }
                  updateZoomButtonsUI()

                  bottomDeck.addView(zoomRow, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = dp(6)
                  })

                  // ROW 2: PIXEL TRIPLE LENS HARDWARE PICKER (Auto 3-Lens | 0.5x UW Lens | 1x Main Lens | 5x Tele Lens)
                  val lensAndSliderRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(4), 0, dp(4), dp(4))
                  }

                  val lensRoles = listOf(
                      "AUTO" to "Auto 3-Lens",
                      "UW" to "0.5x UW Lens",
                      "WIDE" to "1x Main Lens",
                      "TELE" to "5x Tele Lens"
                  )
                  for ((roleKey, roleTitle) in lensRoles) {
                      val chip = TextView(this).apply {
                          text = roleTitle
                          textSize = 10.5f
                          gravity = Gravity.CENTER
                          setPadding(dp(6), dp(4), dp(6), dp(4))
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                              switchPhysicalRearLens(roleKey)
                          }
                      }
                      lensRoleChips[roleKey] = chip
                      lensAndSliderRow.addView(chip, LinearLayout.LayoutParams(0, dp(28), 1f).apply {
                          leftMargin = dp(2)
                          rightMargin = dp(2)
                      })
                  }
                  updateLensRoleChipsUI()

                  bottomDeck.addView(lensAndSliderRow, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = dp(4)
                  })

                  // Fine Continuous Zoom SeekBar (0.5x .. 10.0x)
                  zoomSeekBar = SeekBar(this).apply {
                      max = 95
                      progress = 5
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              if (fromUser) {
                                  val z = 0.5f + (progress / 10.0f)
                                  setZoomSmooth(z, fromPresetButton = false)
                              }
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }
                  bottomDeck.addView(zoomSeekBar, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(22)).apply {
                      bottomMargin = dp(4)
                  })

                  // ROW 3: COLOR LOOKS CAROUSEL ("Natural", "Vivid Pop", "Golden Hour", "Cyber Teal", "Leica Mono", "Vintage")
                  val looksScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                  }
                  val looksRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val lookTitle = TextView(this).apply {
                      text = "LOOK"
                      textSize = 10f
                      setTextColor(Color.parseColor("#94A3B8"))
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      setPadding(dp(4), 0, dp(8), 0)
                  }
                  looksRow.addView(lookTitle)

                  lookLabels.forEachIndexed { idx, label ->
                      val chip = TextView(this).apply {
                          text = label
                          textSize = 11f
                          gravity = Gravity.CENTER
                          setPadding(dp(11), dp(4), dp(11), dp(4))
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                              lookIndex = idx
                              applyLiveLookFilter()
                              updateLookChipsUI()
                          }
                      }
                      lookChips.add(chip)
                      looksRow.addView(chip, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(28)).apply {
                          rightMargin = dp(5)
                      })
                  }
                  updateLookChipsUI()
                  looksScroll.addView(looksRow)
                  bottomDeck.addView(looksScroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = dp(6)
                  })

                  // ROW 4: FRONT CAMERA VIEW LAYOUT CAROUSEL ("PiP Card", "Circle", "70/30 Split", "50/50 Split", "Left/Right")
                  val layoutsScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                  }
                  val layoutsRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val layoutTitle = TextView(this).apply {
                      text = "VIEW"
                      textSize = 10f
                      setTextColor(Color.parseColor("#94A3B8"))
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      setPadding(dp(4), 0, dp(8), 0)
                  }
                  layoutsRow.addView(layoutTitle)

                  layoutLabels.forEachIndexed { idx, label ->
                      val chip = TextView(this).apply {
                          text = label
                          textSize = 11f
                          gravity = Gravity.CENTER
                          setPadding(dp(11), dp(4), dp(11), dp(4))
