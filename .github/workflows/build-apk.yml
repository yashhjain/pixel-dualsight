name: Build Pixel 11 Dual Sight APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Android CameraX Project Files
        run: |
          mkdir -p app/src/main/java/com/pixel11/dualsight

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Pixel11DualSight"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pixel11.dualsight"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.pixel11.dualsight"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              val cameraxVersion = "1.4.0"
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.camera:camera-core:$cameraxVersion")
              implementation("androidx.camera:camera-camera2:$cameraxVersion")
              implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
              implementation("androidx.camera:camera-view:$cameraxVersion")
              implementation("androidx.camera:camera-extensions:$cameraxVersion")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.camera.any" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-feature android:name="android.hardware.camera.concurrent" android:required="false" />
              <uses-permission android:name="android.permission.CAMERA" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Pixel 11 Dual Sight"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:colorMode="hdr"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/pixel11/dualsight/MainActivity.kt
          package com.pixel11.dualsight

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.Outline
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.RenderEffect
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaActionSound
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.MediaStore
          import android.util.Size
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.ViewOutlineProvider
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ConcurrentCamera.SingleCameraConfig
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.Preview
          import androidx.camera.core.UseCaseGroup
          import androidx.camera.core.resolutionselector.AspectRatioStrategy
          import androidx.camera.core.resolutionselector.ResolutionSelector
          import androidx.camera.core.resolutionselector.ResolutionStrategy
          import androidx.camera.extensions.ExtensionMode
          import androidx.camera.extensions.ExtensionsManager
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          class MainActivity : AppCompatActivity() {

              private lateinit var stageCard: FrameLayout
              private lateinit var rearContainer: FrameLayout
              private lateinit var frontContainer: FrameLayout
              private lateinit var previewRear: PreviewView
              private lateinit var previewFront: PreviewView
              private lateinit var gridOverlayView: GridOverlayView
              private lateinit var focusAssembly: LinearLayout
              private lateinit var focusRingCircle: FrameLayout
              private lateinit var focusTagTitle: TextView
              private lateinit var focusTagSub: TextView
              private lateinit var dropdownOverlayContainer: FrameLayout
              private lateinit var viewDropdownMenu: LinearLayout
              private lateinit var lookDropdownMenu: LinearLayout
              private lateinit var flashOverlay: View
              private lateinit var countdownLabel: TextView
              private lateinit var thumbView: ImageView
              private lateinit var photoCountBadge: TextView
              private lateinit var resolutionTelemetryBadge: TextView
              private lateinit var btnViewDropdown: TextView
              private lateinit var btnLookDropdown: TextView
              private lateinit var btnMaxResChip: TextView
              private lateinit var btnFlashChip: TextView
              private lateinit var btnTimerChip: TextView
              private lateinit var btnGridChip: TextView
              private lateinit var btnPipSizeChip: TextView

              private val deckZoomButtons = mutableMapOf<Float, TextView>()
              private val lensRoleCards = mutableMapOf<String, LinearLayout>()
              private val lensRoleTopTexts = mutableMapOf<String, TextView>()
              private val lensRoleSubTexts = mutableMapOf<String, TextView>()
              private val viewMenuRows = mutableListOf<TextView>()
              private val lookMenuRows = mutableListOf<TextView>()

              private var cachedProvider: ProcessCameraProvider? = null
              private var cachedExtensions: ExtensionsManager? = null
              private var rearCamera: Camera? = null
              private var frontCamera: Camera? = null
              private var rearPreviewUseCase: Preview? = null
              private var frontPreviewUseCase: Preview? = null
              private var isBindingCameras = false
              private var isCapturingPhoto = false

              // Pixel 11 Pro XL Triple Rear + 42MP Front Camera Selectors
              private var logicalBackSelector: CameraSelector = CameraSelector.DEFAULT_BACK_CAMERA
              private var defaultFrontSelector: CameraSelector = CameraSelector.DEFAULT_FRONT_CAMERA
              private var ultraWideSelector: CameraSelector? = null
              private var mainWideSelector: CameraSelector? = null
              private var telephotoSelector: CameraSelector? = null
              private var selectedLensRole: String = "AUTO" // "AUTO", "UW", "WIDE", "TELE"

              // Pro Max-Res Mode: Unlocks full single-sensor 4K/QHD+ ISP pipeline (50MP Rear + 42MP Front without Android concurrent HAL cap)
              // with automatic sequential Dual-Snap when pressing Shutter!
              private var proMaxResMode = false
              private var heldRearMaxResBmp: Bitmap? = null
              private var heldFrontMaxResBmp: Bitmap? = null

              private var currentZoom = 1.0f
              private var frontZoom = 1.0f
              private var lastZoomApplyMs = 0L
              private var swapSlots = false
              private var torchEnabled = false
              private var gridEnabled = false
              private var timerSeconds = 0
              private var captureCount = 0
              private var lastSavedUri: Uri? = null

              private val shutterSound = MediaActionSound()
              private val mainHandler = Handler(Looper.getMainLooper())
              private val ioExecutor = Executors.newSingleThreadExecutor()

              // 0 = PiP Card, 1 = Circle Bubble, 2 = 70/30 Split, 3 = 50/50 Split, 4 = Left/Right
              private var layoutMode = 0
              private val layoutLabels = listOf("PiP Card", "Circle Bubble", "70/30 Split", "50/50 Split", "Left/Right")
              private var pipScale = 1.0f

              // 6 Real-Time GPU Color Look Filters
              private var lookIndex = 0
              private val lookLabels = listOf("Natural", "Vivid Pop", "Golden Hour", "Cyber Teal", "Leica Mono", "Vintage")

              private var pipDragX = 0f
              private var pipDragY = 0f
              private var hasCustomPipPos = false

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  if (granted) initializeCameraProvider()
                  else Toast.makeText(this, "Camera permission is required", Toast.LENGTH_LONG).show()
              }

              private fun dp(value: Int): Int =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value.toFloat(), resources.displayMetrics).toInt()

              private fun pillDrawable(fillHex: String, radiusDp: Int, strokeHex: String? = null, strokeDp: Int = 0): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor(fillHex))
                      cornerRadius = dp(radiusDp).toFloat()
                      if (strokeHex != null && strokeDp > 0) {
                          setStroke(dp(strokeDp), Color.parseColor(strokeHex))
                      }
                  }
              }

              private fun circleDrawable(fillHex: String, strokeHex: String? = null, strokeDp: Int = 0): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(Color.parseColor(fillHex))
                      if (strokeHex != null && strokeDp > 0) {
                          setStroke(dp(strokeDp), Color.parseColor(strokeHex))
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#07080C")
                  window.navigationBarColor = Color.parseColor("#07080C")
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      window.attributes = window.attributes.apply {
                          layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
                  shutterSound.load(MediaActionSound.SHUTTER_CLICK)
                  shutterSound.load(MediaActionSound.FOCUS_COMPLETE)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#07080C"))
                      setPadding(dp(8), dp(6), dp(8), dp(8))
                  }

                  // 1. TOP FROSTED HEADER BAR WITH "View: ... v" & "Look: ... v" DROPDOWNS + UTILITY ICONS
                  val topHud = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = pillDrawable("#222634", 24, "#30FFFFFF", 1)
                      setPadding(dp(8), dp(6), dp(8), dp(6))
                  }

                  btnViewDropdown = TextView(this).apply {
                      text = "View: PiP Card ▾"
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      background = pillDrawable("#32384D", 18, "#45FFFFFF", 1)
                      setPadding(dp(11), dp(5), dp(11), dp(5))
                      setOnClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                          toggleTopDropdown(showViewMenu = true)
                      }
                  }

                  btnLookDropdown = TextView(this).apply {
                      text = "Look: Natural ▾"
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      background = pillDrawable("#2A2F42", 18, "#33FFFFFF", 1)
                      setPadding(dp(11), dp(5), dp(11), dp(5))
                      setOnClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                          toggleTopDropdown(showViewMenu = false)
                      }
                  }

                  // 4K+ Dual Max-Res Toggle (keeps BOTH Rear & Front cameras live using full-sensor 4:3 High-Resolution strategy + Ultra-HD 4K output)
                  btnMaxResChip = buildIconCircleChip("4K+") {
                      proMaxResMode = !proMaxResMode
                      btnMaxResChip.background = if (proMaxResMode) circleDrawable("#FACC15") else circleDrawable("#2E3446", "#33FFFFFF", 1)
                      btnMaxResChip.setTextColor(if (proMaxResMode) Color.BLACK else Color.WHITE)
                      Toast.makeText(
                          this@MainActivity,
                          if (proMaxResMode) "4K+ Dual Max-Res Active (Both Rear & Front Live)"
                          else "Standard Dual Stream Active",
                          Toast.LENGTH_SHORT
                      ).show()
                      bindDualCamerasSafely()
                  }

                  btnFlashChip = buildIconCircleChip("⚡") {
                      torchEnabled = !torchEnabled
                      rearCamera?.cameraControl?.enableTorch(torchEnabled)
                      btnFlashChip.background = if (torchEnabled) circleDrawable("#F59E0B") else circleDrawable("#2E3446", "#33FFFFFF", 1)
                      btnFlashChip.setTextColor(if (torchEnabled) Color.BLACK else Color.WHITE)
                  }

                  btnTimerChip = buildIconCircleChip("⏱") {
                      timerSeconds = when (timerSeconds) {
                          0 -> 3
                          3 -> 5
                          else -> 0
                      }
                      btnTimerChip.text = if (timerSeconds == 0) "⏱" else "${timerSeconds}s"
                      btnTimerChip.background = if (timerSeconds > 0) circleDrawable("#3B82F6") else circleDrawable("#2E3446", "#33FFFFFF", 1)
                  }

                  btnGridChip = buildIconCircleChip("⊞") {
                      gridEnabled = !gridEnabled
                      gridOverlayView.visibility = if (gridEnabled) View.VISIBLE else View.GONE
                      btnGridChip.background = if (gridEnabled) circleDrawable("#3B82F6") else circleDrawable("#2E3446", "#33FFFFFF", 1)
                  }

                  btnPipSizeChip = buildIconCircleChip("◰") {
                      pipScale = when {
                          pipScale == 1.0f -> 1.28f
                          pipScale > 1.0f -> 0.78f
                          else -> 1.0f
                      }
                      applyFrontCameraLayout()
                      val label = if (pipScale > 1f) "Large" else if (pipScale < 1f) "Small" else "Medium"
                      Toast.makeText(this@MainActivity, "PiP Window: $label", Toast.LENGTH_SHORT).show()
                  }

                  topHud.addView(btnViewDropdown, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(32)).apply { rightMargin = dp(6) })
                  topHud.addView(btnLookDropdown, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(32)))
                  topHud.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                  topHud.addView(btnMaxResChip, LinearLayout.LayoutParams(dp(32), dp(32)).apply { rightMargin = dp(4) })
                  topHud.addView(btnFlashChip, LinearLayout.LayoutParams(dp(32), dp(32)).apply { rightMargin = dp(4) })
                  topHud.addView(btnTimerChip, LinearLayout.LayoutParams(dp(32), dp(32)).apply { rightMargin = dp(4) })
                  topHud.addView(btnGridChip, LinearLayout.LayoutParams(dp(32), dp(32)).apply { rightMargin = dp(4) })
                  topHud.addView(btnPipSizeChip, LinearLayout.LayoutParams(dp(32), dp(32)))

                  root.addView(topHud, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = dp(6)
                  })

                  // 2. EXPANSIVE QHD+ ROUNDED 24DP VIEWFINDER STAGE (Takes 75%+ of screen height)
                  stageCard = FrameLayout(this).apply {
                      background = pillDrawable("#000000", 24, "#29FFFFFF", 1)
                      clipChildren = true
                      clipToPadding = true
                      clipToOutline = true
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, dp(24).toFloat())
                          }
                      }
                  }

                  rearContainer = FrameLayout(this).apply {
                      clipChildren = true
                      clipToPadding = true
                      elevation = 0f
                  }
                  frontContainer = FrameLayout(this).apply {
                      clipChildren = true
                      clipToPadding = true
                      elevation = dp(4).toFloat()
                  }

                  previewRear = PreviewView(this).apply {
                      implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                      scaleType = PreviewView.ScaleType.FILL_CENTER
                  }
                  previewFront = PreviewView(this).apply {
                      implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                      scaleType = PreviewView.ScaleType.FILL_CENTER
                  }

                  rearContainer.addView(previewRear, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))
                  frontContainer.addView(previewFront, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  stageCard.addView(rearContainer)
                  stageCard.addView(frontContainer)

                  // 3x3 Rule-of-Thirds Grid Overlay (elevation = 12dp)
                  gridOverlayView = GridOverlayView(this).apply {
                      visibility = View.GONE
                      elevation = dp(12).toFloat()
                  }
                  stageCard.addView(gridOverlayView, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  // Subtle Top Resolution & Sensor Telemetry Pill (elevation = 18dp)
                  resolutionTelemetryBadge = TextView(this).apply {
                      text = "50MP REAR • 42MP FRONT PDAF"
                      textSize = 10f
                      setTextColor(Color.parseColor("#E2E8F0"))
                      typeface = Typeface.MONOSPACE
                      background = pillDrawable("#88090A0F", 12, "#28FFFFFF", 1)
                      setPadding(dp(10), dp(3), dp(10), dp(3))
                      elevation = dp(18).toFloat()
                  }
                  stageCard.addView(resolutionTelemetryBadge, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.TOP or Gravity.END
                  ).apply {
                      topMargin = dp(10)
                      rightMargin = dp(12)
                  })

                  // Center / Tap Focus Assembly (Gold Focus Ring + Attached Pill Badge matching mockup 1:1, elevation = 22dp)
                  focusAssembly = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      alpha = 0f
                      elevation = dp(22).toFloat()
                  }

                  focusRingCircle = FrameLayout(this).apply {
                      background = circleDrawable("#18FACC15", "#FACC15", 2)
                  }

                  val focusBadgePill = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = pillDrawable("#CC1E1B18", 20, "#66FACC15", 1)
                      setPadding(dp(6), dp(5), dp(12), dp(5))
                  }

                  val focusZoomBubble = TextView(this).apply {
                      id = 1001
                      text = "1x"
                      textSize = 11f
                      setTextColor(Color.BLACK)
                      gravity = Gravity.CENTER
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      background = circleDrawable("#FACC15")
                  }

                  val focusTextCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(8), 0, 0, 0)
                  }

                  focusTagTitle = TextView(this).apply {
                      text = "WIDE"
                      textSize = 11f
                      setTextColor(Color.parseColor("#FDE047"))
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                  }

                  focusTagSub = TextView(this).apply {
                      text = "50MP • AF LOCKED"
                      textSize = 9.5f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.MONOSPACE
                  }

                  focusTextCol.addView(focusTagTitle)
                  focusTextCol.addView(focusTagSub)
                  focusBadgePill.addView(focusZoomBubble, LinearLayout.LayoutParams(dp(28), dp(28)))
                  focusBadgePill.addView(focusTextCol)

                  focusAssembly.addView(focusRingCircle, LinearLayout.LayoutParams(dp(68), dp(68)))
                  focusAssembly.addView(focusBadgePill, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      leftMargin = dp(4)
                  })

                  stageCard.addView(focusAssembly, FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT))

                  // Frosted Glass Top Dropdown Menus Overlay (elevation = 26dp inside top of stageCard)
                  dropdownOverlayContainer = FrameLayout(this).apply {
                      visibility = View.GONE
                      elevation = dp(26).toFloat()
                      setBackgroundColor(Color.parseColor("#33000000"))
                      setOnClickListener {
                          visibility = View.GONE
                      }
                  }

                  viewDropdownMenu = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = pillDrawable("#EE1C1F2B", 18, "#38FFFFFF", 1)
                      setPadding(dp(6), dp(6), dp(6), dp(6))
                      visibility = View.GONE
                  }
                  layoutLabels.forEachIndexed { idx, label ->
                      val row = TextView(this).apply {
                          text = label
                          textSize = 12.5f
                          setTextColor(Color.WHITE)
                          setPadding(dp(14), dp(9), dp(20), dp(9))
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                              layoutMode = idx
                              hasCustomPipPos = false
                              btnViewDropdown.text = "View: $label ▾"
                              updateDropdownSelectionStyles()
                              dropdownOverlayContainer.visibility = View.GONE
                              applyFrontCameraLayout()
                          }
                      }
                      viewMenuRows.add(row)
                      viewDropdownMenu.addView(row, LinearLayout.LayoutParams(dp(156), LinearLayout.LayoutParams.WRAP_CONTENT))
                  }

                  lookDropdownMenu = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = pillDrawable("#EE1C1F2B", 18, "#38FFFFFF", 1)
                      setPadding(dp(6), dp(6), dp(6), dp(6))
                      visibility = View.GONE
                  }
                  lookLabels.forEachIndexed { idx, label ->
                      val row = TextView(this).apply {
                          text = label
                          textSize = 12.5f
                          setTextColor(Color.WHITE)
                          setPadding(dp(14), dp(9), dp(20), dp(9))
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                              lookIndex = idx
                              btnLookDropdown.text = "Look: $label ▾"
                              updateDropdownSelectionStyles()
                              dropdownOverlayContainer.visibility = View.GONE
                              applyLiveLookFilter()
                          }
                      }
                      lookMenuRows.add(row)
                      lookDropdownMenu.addView(row, LinearLayout.LayoutParams(dp(156), LinearLayout.LayoutParams.WRAP_CONTENT))
                  }

                  updateDropdownSelectionStyles()
                  dropdownOverlayContainer.addView(viewDropdownMenu, FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.TOP or Gravity.START).apply {
                      topMargin = dp(8)
                      leftMargin = dp(8)
                  })
                  dropdownOverlayContainer.addView(lookDropdownMenu, FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.TOP or Gravity.START).apply {
                      topMargin = dp(8)
                      leftMargin = dp(132)
                  })
                  stageCard.addView(dropdownOverlayContainer, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  // Countdown Overlay (elevation = 28dp)
                  countdownLabel = TextView(this).apply {
                      text = "3"
                      textSize = 68f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.create("sans-serif-black", Typeface.BOLD)
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                      elevation = dp(28).toFloat()
                  }
                  stageCard.addView(countdownLabel, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  // Shutter Rim & Screen Flash Overlay (elevation = 30dp)
                  flashOverlay = View(this).apply {
                      background = pillDrawable("#FFFFFF", 24, "#3B82F6", 6)
                      alpha = 0f
                      isClickable = false
                      elevation = dp(30).toFloat()
                  }
                  stageCard.addView(flashOverlay, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  root.addView(stageCard, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))

                  // 3. STREAMLINED FLAGSHIP BOTTOM CAMERA DECK (Matches approved UI mockup 1:1)
                  val bottomDeck = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
