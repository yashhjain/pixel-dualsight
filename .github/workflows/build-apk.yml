name: Build Pixel 11 Dual Sight APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Android CameraX Project Files
        run: |
          mkdir -p app/src/main/java/com/pixel11/dualsight

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Pixel11DualSight"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pixel11.dualsight"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.pixel11.dualsight"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              val cameraxVersion = "1.4.0"
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.camera:camera-core:$cameraxVersion")
              implementation("androidx.camera:camera-camera2:$cameraxVersion")
              implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
              implementation("androidx.camera:camera-view:$cameraxVersion")
              implementation("androidx.camera:camera-extensions:$cameraxVersion")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.camera.any" />
              <uses-feature android:name="android.hardware.camera.concurrent" android:required="false" />
              <uses-permission android:name="android.permission.CAMERA" />
              <application
                  android:allowBackup="true"
                  android:label="Pixel 11 Dual Sight"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:colorMode="hdr"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/pixel11/dualsight/MainActivity.kt
          package com.pixel11.dualsight

          import android.Manifest
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.Outline
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.RenderEffect
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaActionSound
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.ViewOutlineProvider
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ConcurrentCamera.SingleCameraConfig
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.Preview
          import androidx.camera.core.UseCaseGroup
          import androidx.camera.extensions.ExtensionMode
          import androidx.camera.extensions.ExtensionsManager
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import kotlin.math.abs
          import kotlin.math.min

          class MainActivity : AppCompatActivity() {

              private lateinit var stageCard: FrameLayout
              private lateinit var rearContainer: FrameLayout
              private lateinit var frontContainer: FrameLayout
              private lateinit var previewRear: PreviewView
              private lateinit var previewFront: PreviewView
              private lateinit var gridOverlayView: GridOverlayView
              private lateinit var focusRingView: View
              private lateinit var flashOverlay: View
              private lateinit var countdownLabel: TextView
              private lateinit var thumbView: ImageView
              private lateinit var photoCountBadge: TextView
              private lateinit var zoomTextBadge: TextView
              private lateinit var btnPipSizeChip: TextView
              private lateinit var btnFlashChip: TextView
              private lateinit var btnTimerChip: TextView
              private lateinit var btnGridChip: TextView

              private val zoomButtons = mutableMapOf<Float, TextView>()
              private val layoutChips = mutableListOf<TextView>()
              private val lookChips = mutableListOf<TextView>()

              private var rearCamera: Camera? = null
              private var frontCamera: Camera? = null
              private var currentZoom = 1.0f
              private var swapSlots = false
              private var torchEnabled = false
              private var gridEnabled = false
              private var timerSeconds = 0
              private var captureCount = 0
              private var lastSavedUri: Uri? = null
              private val shutterSound = MediaActionSound()
              private val mainHandler = Handler(Looper.getMainLooper())

              // 0 = PiP Floating Card, 1 = Circle Bubble, 2 = 70/30 Split, 3 = 50/50 Split, 4 = Left/Right Split
              private var layoutMode = 0
              private val layoutLabels = listOf("PiP Card", "Circle Bubble", "70/30 Split", "50/50 Split", "Side-by-Side")
              private var pipScale = 1.0f // 0.78f (S), 1.0f (M), 1.28f (L)

              // Color Look Filters (0 = Natural, 1 = Vivid Pop, 2 = Golden Hour, 3 = Cyber Teal, 4 = Leica Mono, 5 = Vintage Film)
              private var lookIndex = 0
              private val lookLabels = listOf("Natural", "Vivid Pop", "Golden Hour", "Cyber Teal", "Leica Mono", "Vintage")

              // Draggable PiP coordinates
              private var pipDragX = 0f
              private var pipDragY = 0f
              private var hasCustomPipPos = false

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  if (granted) startDualConcurrentCamera()
                  else Toast.makeText(this, "Camera permission is required", Toast.LENGTH_LONG).show()
              }

              private fun dp(value: Int): Int =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value.toFloat(), resources.displayMetrics).toInt()

              private fun pillDrawable(fillHex: String, radiusDp: Int, strokeHex: String? = null, strokeDp: Int = 0): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor(fillHex))
                      cornerRadius = dp(radiusDp).toFloat()
                      if (strokeHex != null && strokeDp > 0) {
                          setStroke(dp(strokeDp), Color.parseColor(strokeHex))
                      }
                  }
              }

              private fun circleDrawable(fillHex: String, strokeHex: String? = null, strokeDp: Int = 0): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(Color.parseColor(fillHex))
                      if (strokeHex != null && strokeDp > 0) {
                          setStroke(dp(strokeDp), Color.parseColor(strokeHex))
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#07080C")
                  window.navigationBarColor = Color.parseColor("#07080C")
                  shutterSound.load(MediaActionSound.SHUTTER_CLICK)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#07080C"))
                      setPadding(dp(10), dp(8), dp(10), dp(10))
                  }

                  // 1. PREMIUM TOP GLASS HUD BAR
                  val topHud = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = pillDrawable("#141722", 24, "#24FFFFFF", 1)
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                  }

                  val brandTitle = TextView(this).apply {
                      text = "PIXEL PRO • DUAL"
                      setTextColor(Color.WHITE)
                      textSize = 11.5f
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      letterSpacing = 0.06f
                  }

                  btnFlashChip = buildTopUtilityChip("⚡ Off") {
                      torchEnabled = !torchEnabled
                      rearCamera?.cameraControl?.enableTorch(torchEnabled)
                      btnFlashChip.text = if (torchEnabled) "⚡ On" else "⚡ Off"
                      btnFlashChip.background = if (torchEnabled) pillDrawable("#F59E0B", 16) else pillDrawable("#222634", 16)
                      btnFlashChip.setTextColor(if (torchEnabled) Color.BLACK else Color.WHITE)
                  }

                  btnTimerChip = buildTopUtilityChip("⏱ Off") {
                      timerSeconds = when (timerSeconds) {
                          0 -> 3
                          3 -> 5
                          else -> 0
                      }
                      btnTimerChip.text = if (timerSeconds == 0) "⏱ Off" else "⏱ ${timerSeconds}s"
                      btnTimerChip.background = if (timerSeconds > 0) pillDrawable("#3B82F6", 16) else pillDrawable("#222634", 16)
                  }

                  btnGridChip = buildTopUtilityChip("# Grid") {
                      gridEnabled = !gridEnabled
                      gridOverlayView.visibility = if (gridEnabled) View.VISIBLE else View.GONE
                      btnGridChip.background = if (gridEnabled) pillDrawable("#3B82F6", 16) else pillDrawable("#222634", 16)
                  }

                  btnPipSizeChip = buildTopUtilityChip("PiP: M") {
                      pipScale = when {
                          pipScale == 1.0f -> 1.28f
                          pipScale > 1.0f -> 0.78f
                          else -> 1.0f
                      }
                      val sizeTag = when {
                          pipScale > 1.0f -> "L"
                          pipScale < 1.0f -> "S"
                          else -> "M"
                      }
                      btnPipSizeChip.text = "PiP: $sizeTag"
                      applyFrontCameraLayout()
                  }

                  topHud.addView(brandTitle, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  topHud.addView(btnFlashChip, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(30)).apply { rightMargin = dp(6) })
                  topHud.addView(btnTimerChip, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(30)).apply { rightMargin = dp(6) })
                  topHud.addView(btnGridChip, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(30)).apply { rightMargin = dp(6) })
                  topHud.addView(btnPipSizeChip, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(30)))

                  root.addView(topHud, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = dp(8)
                  })

                  // 2. ROUNDED 28DP FLAGSHIP VIEWFINDER STAGE
                  stageCard = FrameLayout(this).apply {
                      background = pillDrawable("#000000", 28, "#29FFFFFF", 1)
                      clipToOutline = true
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, dp(28).toFloat())
                          }
                      }
                  }

                  rearContainer = FrameLayout(this)
                  frontContainer = FrameLayout(this)

                  previewRear = PreviewView(this).apply {
                      implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                      scaleType = PreviewView.ScaleType.FILL_CENTER
                  }
                  previewFront = PreviewView(this).apply {
                      implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                      scaleType = PreviewView.ScaleType.FILL_CENTER
                  }

                  rearContainer.addView(previewRear, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))
                  frontContainer.addView(previewFront, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  stageCard.addView(rearContainer)
                  stageCard.addView(frontContainer)

                  // 3x3 Rule-of-Thirds Grid Overlay
                  gridOverlayView = GridOverlayView(this).apply {
                      visibility = View.GONE
                  }
                  stageCard.addView(gridOverlayView, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  // Tap-to-Focus Ring Indicator
                  focusRingView = View(this).apply {
                      background = circleDrawable("#00000000", "#FACC15", 2)
                      alpha = 0f
                  }
                  stageCard.addView(focusRingView, FrameLayout.LayoutParams(dp(64), dp(64)))

                  // Top-Left & Top-Right Live Sensor Pills inside Viewfinder
                  val lensBadgesRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(14), dp(12), dp(14), dp(8))
                  }

                  val rearBadge = TextView(this).apply {
                      text = "● REAR 50MP HDR"
                      setTextColor(Color.parseColor("#A7F3D0"))
                      textSize = 10.5f
                      typeface = Typeface.MONOSPACE
                      background = pillDrawable("#99090A0F", 14, "#33FFFFFF", 1)
                      setPadding(dp(10), dp(4), dp(10), dp(4))
                  }

                  zoomTextBadge = TextView(this).apply {
                      text = "1.0x"
                      setTextColor(Color.parseColor("#FDE047"))
                      textSize = 11.5f
                      typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                      background = pillDrawable("#99090A0F", 14, "#44FDE047", 1)
                      setPadding(dp(10), dp(4), dp(10), dp(4))
                  }

                  lensBadgesRow.addView(rearBadge)
                  lensBadgesRow.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                  lensBadgesRow.addView(zoomTextBadge)
                  stageCard.addView(lensBadgesRow, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.TOP))

                  // Pixel Flagship Floating Zoom Pill Dock (.6x, 1x, 2x, 5x, 10x)
                  val zoomDock = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      background = pillDrawable("#B80D0F17", 28, "#33FFFFFF", 1)
                      setPadding(dp(6), dp(5), dp(6), dp(5))
                  }

                  val presets = listOf(0.6f to ".6", 1.0f to "1x", 2.0f to "2x", 5.0f to "5x", 10.0f to "10x")
                  for ((zVal, zLabel) in presets) {
                      val pill = TextView(this).apply {
                          text = zLabel
                          gravity = Gravity.CENTER
                          textSize = 11.5f
                          typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              applyZoomRatio(zVal)
                          }
                      }
                      zoomButtons[zVal] = pill
                      zoomDock.addView(pill, LinearLayout.LayoutParams(dp(40), dp(34)).apply {
                          leftMargin = dp(2)
                          rightMargin = dp(2)
                      })
                  }
                  updateZoomButtonsUI()

                  stageCard.addView(zoomDock, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                  ).apply { bottomMargin = dp(14) })

                  // Center Countdown Overlay Text
                  countdownLabel = TextView(this).apply {
                      text = "3"
                      textSize = 68f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.create("sans-serif-black", Typeface.BOLD)
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                  }
                  stageCard.addView(countdownLabel, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  // Shutter Rim & Screen Flash Overlay
                  flashOverlay = View(this).apply {
                      background = pillDrawable("#FFFFFF", 28, "#3B82F6", 6)
                      alpha = 0f
                      isClickable = false
                  }
                  stageCard.addView(flashOverlay, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  root.addView(stageCard, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))

                  // 3. BOTTOM CAMERA DECK: LOOKS CAROUSEL + VIEW LAYOUT CAROUSEL + ICONIC SHUTTER BAR
                  val bottomDeck = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = pillDrawable("#11131C", 28, "#1FFFFFFF", 1)
                      setPadding(dp(12), dp(10), dp(12), dp(12))
                  }

                  // Row A: Color Looks Strip ("Natural", "Vivid Pop", "Golden Hour", "Cyber Teal", "Leica Mono", "Vintage")
                  val looksScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                  }
                  val looksRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val lookTitle = TextView(this).apply {
                      text = "LOOK"
                      textSize = 10f
                      setTextColor(Color.parseColor("#94A3B8"))
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      setPadding(dp(4), 0, dp(8), 0)
                  }
                  looksRow.addView(lookTitle)

                  lookLabels.forEachIndexed { idx, label ->
                      val chip = TextView(this).apply {
                          text = label
                          textSize = 11.5f
                          gravity = Gravity.CENTER
                          setPadding(dp(12), dp(5), dp(12), dp(5))
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                              lookIndex = idx
                              applyLiveLookFilter()
                              updateLookChipsUI()
                          }
                      }
                      lookChips.add(chip)
                      looksRow.addView(chip, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(30)).apply {
                          rightMargin = dp(6)
                      })
                  }
                  updateLookChipsUI()
                  looksScroll.addView(looksRow)
                  bottomDeck.addView(looksScroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = dp(8)
                  })

                  // Row B: Front Camera View Layout Strip ("PiP Card", "Circle Bubble", "70/30 Split", "50/50 Split", "Side-by-Side")
                  val layoutsScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                  }
                  val layoutsRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val layoutTitle = TextView(this).apply {
                      text = "VIEW"
                      textSize = 10f
                      setTextColor(Color.parseColor("#94A3B8"))
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      setPadding(dp(4), 0, dp(8), 0)
                  }
                  layoutsRow.addView(layoutTitle)

                  layoutLabels.forEachIndexed { idx, label ->
                      val chip = TextView(this).apply {
                          text = label
                          textSize = 11.5f
                          gravity = Gravity.CENTER
                          setPadding(dp(12), dp(5), dp(12), dp(5))
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                              layoutMode = idx
                              hasCustomPipPos = false
                              applyFrontCameraLayout()
                              updateLayoutChipsUI()
                          }
                      }
                      layoutChips.add(chip)
                      layoutsRow.addView(chip, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(30)).apply {
                          rightMargin = dp(6)
                      })
                  }
                  updateLayoutChipsUI()
                  layoutsScroll.addView(layoutsRow)
                  bottomDeck.addView(layoutsScroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = dp(10)
                  })

                  // Row C: Flagship Shutter Bar (Gallery Thumbnail Well | Double-Ring Pixel Shutter | Swap Front/Rear Button)
                  val shutterRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(12), dp(2), dp(12), dp(2))
                  }

                  // Left: Gallery Thumbnail Well + Count Badge
                  val galleryWellFrame = FrameLayout(this)
                  thumbView = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      background = circleDrawable("#1E293B", "#80FFFFFF", 2)
                      clipToOutline = true
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setOval(0, 0, view.width, view.height)
                          }
                      }
                      setOnClickListener {
                          lastSavedUri?.let { uri ->
                              val intent = Intent(Intent.ACTION_VIEW).apply {
                                  setDataAndType(uri, "image/png")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              }
                              try { startActivity(intent) } catch (_: Exception) {}
                          } ?: Toast.makeText(this@MainActivity, "Tap the center shutter to capture a Dual Sight photo!", Toast.LENGTH_SHORT).show()
                      }
                  }
                  photoCountBadge = TextView(this).apply {
                      text = "0"
                      textSize = 10f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      background = circleDrawable("#2563EB", "#07080C", 2)
                      visibility = View.GONE
                  }
                  galleryWellFrame.addView(thumbView, FrameLayout.LayoutParams(dp(54), dp(54), Gravity.CENTER))
                  galleryWellFrame.addView(photoCountBadge, FrameLayout.LayoutParams(dp(20), dp(20), Gravity.TOP or Gravity.END))

                  // Center: Flagship Double-Ring Pixel Shutter Button
                  val shutterOuterRing = FrameLayout(this).apply {
                      background = circleDrawable("#00000000", "#FFFFFF", 3)
                      setPadding(dp(5), dp(5), dp(5), dp(5))
                  }
                  val shutterInnerDisc = View(this).apply {
                      background = circleDrawable("#F8FAFC", "#CBD5E1", 2)
                  }
                  shutterOuterRing.addView(shutterInnerDisc, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))
                  shutterOuterRing.setOnClickListener {
                      triggerPixelShutterSequence(shutterInnerDisc)
                  }

                  // Right: Swap Primary/Secondary Cameras Button
                  val btnSwapCams = TextView(this).apply {
                      text = "⇅ Swap"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      background = pillDrawable("#1E293B", 27, "#33FFFFFF", 1)
                      setOnClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                          swapSlots = !swapSlots
                          applyFrontCameraLayout()
                          Toast.makeText(
                              this@MainActivity,
                              if (swapSlots) "Swapped: Front Main + Rear PiP" else "Swapped: Rear Main + Front PiP",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }

                  shutterRow.addView(galleryWellFrame, LinearLayout.LayoutParams(dp(60), dp(60)))
                  shutterRow.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                  shutterRow.addView(shutterOuterRing, LinearLayout.LayoutParams(dp(76), dp(76)))
                  shutterRow.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                  shutterRow.addView(btnSwapCams, LinearLayout.LayoutParams(dp(68), dp(50)))

                  bottomDeck.addView(shutterRow, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  root.addView(bottomDeck, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      topMargin = dp(8)
                  })

                  setContentView(root)

                  stageCard.post {
                      applyFrontCameraLayout()
                  }

                  setupTouchGestures()

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      startDualConcurrentCamera()
                  } else {
                      permissionLauncher.launch(Manifest.permission.CAMERA)
                  }
              }

              private fun buildTopUtilityChip(label: String, onClick: () -> Unit): TextView {
                  return TextView(this).apply {
                      text = label
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      background = pillDrawable("#222634", 16)
                      setPadding(dp(10), dp(4), dp(10), dp(4))
                      setOnClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                          onClick()
                      }
                  }
              }

              private fun updateLookChipsUI() {
                  lookChips.forEachIndexed { idx, chip ->
                      if (idx == lookIndex) {
                          chip.setTextColor(Color.BLACK)
                          chip.background = pillDrawable("#FACC15", 16)
                          chip.typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      } else {
                          chip.setTextColor(Color.parseColor("#E2E8F0"))
                          chip.background = pillDrawable("#1E2230", 16, "#26FFFFFF", 1)
                          chip.typeface = Typeface.create("sans-serif", Typeface.NORMAL)
                      }
                  }
              }

              private fun updateLayoutChipsUI() {
                  layoutChips.forEachIndexed { idx, chip ->
                      if (idx == layoutMode) {
                          chip.setTextColor(Color.WHITE)
                          chip.background = pillDrawable("#2563EB", 16)
                          chip.typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      } else {
                          chip.setTextColor(Color.parseColor("#E2E8F0"))
                          chip.background = pillDrawable("#1E2230", 16, "#26FFFFFF", 1)
                          chip.typeface = Typeface.create("sans-serif", Typeface.NORMAL)
                      }
                  }
              }

              private fun getSelectedColorMatrix(): ColorMatrix {
                  return when (lookIndex) {
                      1 -> {
                          // Vivid Pop: Boosted saturation + contrast punch
                          ColorMatrix().apply { setSaturation(1.45f) }
                      }
                      2 -> {
                          // Golden Hour: Warm amber/gold highlights
                          ColorMatrix(floatArrayOf(
                              1.15f, 0.05f, 0f, 0f, 12f,
                              0.02f, 1.05f, 0f, 0f, 6f,
                              0f, 0f, 0.85f, 0f, -8f,
                              0f, 0f, 0f, 1f, 0f
                          ))
                      }
                      3 -> {
                          // Cyber Teal: Crisp cinema teal & orange grade
                          ColorMatrix(floatArrayOf(
                              1.08f, -0.04f, 0f, 0f, 0f,
                              0f, 1.08f, 0.06f, 0f, 4f,
                              -0.05f, 0.08f, 1.18f, 0f, 10f,
                              0f, 0f, 0f, 1f, 0f
                          ))
                      }
                      4 -> {
                          // Leica Mono: High-contrast black and white
                          val bw = ColorMatrix().apply { setSaturation(0f) }
                          val contrast = ColorMatrix(floatArrayOf(
                              1.25f, 0f, 0f, 0f, -20f,
                              0f, 1.25f, 0f, 0f, -20f,
                              0f, 0f, 1.25f, 0f, -20f,
                              0f, 0f, 0f, 1f, 0f
                          ))
                          bw.postConcat(contrast)
                          bw
                      }
                      5 -> {
                          // Vintage Film: Classic warm faded film curve
                          ColorMatrix(floatArrayOf(
                              0.95f, 0.18f, 0.05f, 0f, 14f,
                              0.08f, 0.92f, 0.05f, 0f, 10f,
                              0.04f, 0.08f, 0.78f, 0f, 18f,
                              0f, 0f, 0f, 1f, 0f
                          ))
                      }
                      else -> ColorMatrix()
                  }
              }

              private fun applyLiveLookFilter() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      if (lookIndex == 0) {
                          rearContainer.setRenderEffect(null)
                          frontContainer.setRenderEffect(null)
                      } else {
                          val filter = ColorMatrixColorFilter(getSelectedColorMatrix())
                          val effect = RenderEffect.createColorFilterEffect(filter)
                          rearContainer.setRenderEffect(effect)
                          frontContainer.setRenderEffect(effect)
                      }
                  }
              }

              private fun setupTouchGestures() {
                  val scaleDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScale(detector: ScaleGestureDetector): Boolean {
                          val nextZoom = (currentZoom * detector.scaleFactor).coerceIn(0.6f, 10.0f)
                          applyZoomRatio(nextZoom)
                          return true
                      }
                  })

                  stageCard.setOnTouchListener { _, event ->
                      scaleDetector.onTouchEvent(event)
                      if (!scaleDetector.isInProgress && event.actionMasked == MotionEvent.ACTION_UP) {
                          showTapFocusRing(event.x, event.y)
                      }
                      true
                  }

                  var dX = 0f
                  var dY = 0f
                  var moved = false
                  val attachDrag = { targetView: FrameLayout ->
                      targetView.setOnTouchListener { v, event ->
                          val isFloating = (layoutMode == 0 || layoutMode == 1)
                          val secondaryContainer = if (swapSlots) rearContainer else frontContainer
                          if (!isFloating || v !== secondaryContainer) return@setOnTouchListener false

                          when (event.actionMasked) {
                              MotionEvent.ACTION_DOWN -> {
                                  dX = v.x - event.rawX
                                  dY = v.y - event.rawY
                                  moved = false
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val newX = (event.rawX + dX).coerceIn(dp(10).toFloat(), (stageCard.width - v.width - dp(10)).toFloat())
                                  val newY = (event.rawY + dY).coerceIn(dp(44).toFloat(), (stageCard.height - v.height - dp(62)).toFloat())
                                  if (abs(newX - v.x) > 3f || abs(newY - v.y) > 3f) moved = true
                                  v.x = newX
                                  v.y = newY
                                  pipDragX = newX
                                  pipDragY = newY
                                  hasCustomPipPos = true
                                  true
                              }
                              MotionEvent.ACTION_UP -> moved
                              else -> false
                          }
                      }
                  }
                  attachDrag(frontContainer)
                  attachDrag(rearContainer)
              }

              private fun showTapFocusRing(x: Float, y: Float) {
                  focusRingView.x = x - focusRingView.width / 2f
                  focusRingView.y = y - focusRingView.height / 2f
                  focusRingView.scaleX = 1.35f
                  focusRingView.scaleY = 1.35f
                  focusRingView.alpha = 1f
                  focusRingView.animate()
                      .scaleX(1f)
                      .scaleY(1f)
                      .setDuration(180)
                      .withEndAction {
                          focusRingView.animate().alpha(0f).setStartDelay(550).setDuration(250).start()
                      }
                      .start()

                  try {
                      val point = previewRear.meteringPointFactory.createPoint(x, y)
                      val action = FocusMeteringAction.Builder(point).build()
                      rearCamera?.cameraControl?.startFocusAndMetering(action)
                  } catch (_: Exception) {}
              }

              private fun applyZoomRatio(targetZoom: Float) {
                  currentZoom = targetZoom
                  zoomTextBadge.text = String.format("%.1fx", currentZoom)
                  updateZoomButtonsUI()

                  val cam = rearCamera
                  if (cam != null) {
                      val zoomState = cam.cameraInfo.zoomState.value
                      val minZ = zoomState?.minZoomRatio ?: 1.0f
                      val maxZ = zoomState?.maxZoomRatio ?: 1.0f
                      if (maxZ > minZ) {
                          val hwZoom = targetZoom.coerceIn(minZ, maxZ)
                          cam.cameraControl.setZoomRatio(hwZoom)
                          val extraScale = (targetZoom / hwZoom).coerceAtLeast(1.0f)
                          previewRear.scaleX = extraScale
                          previewRear.scaleY = extraScale
                          return
                      }
                  }
                  val swScale = targetZoom.coerceAtLeast(1.0f)
                  previewRear.scaleX = swScale
                  previewRear.scaleY = swScale
              }

              private fun updateZoomButtonsUI() {
                  for ((zVal, pill) in zoomButtons) {
                      val selected = abs(currentZoom - zVal) < 0.15f
                      if (selected) {
                          pill.setTextColor(Color.BLACK)
                          pill.background = circleDrawable("#FACC15")
                          pill.scaleX = 1.08f
                          pill.scaleY = 1.08f
                      } else {
                          pill.setTextColor(Color.WHITE)
                          pill.background = circleDrawable("#26FFFFFF")
                          pill.scaleX = 1.0f
                          pill.scaleY = 1.0f
                      }
                  }
              }

              private fun applyFrontCameraLayout() {
                  val W = stageCard.width.takeIf { it > 0 } ?: (resources.displayMetrics.widthPixels - dp(20))
                  val H = stageCard.height.takeIf { it > 0 } ?: (resources.displayMetrics.heightPixels - dp(240))

                  val primaryContainer = if (swapSlots) frontContainer else rearContainer
                  val secondaryContainer = if (swapSlots) rearContainer else frontContainer

                  // Ensure secondary is drawn above primary in FrameLayout z-order
                  primaryContainer.elevation = dp(1).toFloat()
                  secondaryContainer.elevation = dp(8).toFloat()

                  btnPipSizeChip.visibility = if (layoutMode == 0 || layoutMode == 1) View.VISIBLE else View.GONE

                  when (layoutMode) {
                      0, 1 -> {
                          // Full Primary + Draggable Floating Card (0) or Circle Bubble (1)
                          primaryContainer.layoutParams = FrameLayout.LayoutParams(W, H, Gravity.TOP or Gravity.START)
                          primaryContainer.clipToOutline = false
                          primaryContainer.background = null
                          primaryContainer.post {
                              primaryContainer.x = 0f
                              primaryContainer.y = 0f
                          }

                          val isCircle = (layoutMode == 1)
                          val baseW = (min(W, H) * (if (isCircle) 0.32f else 0.33f) * pipScale).toInt()
                          val baseH = if (isCircle) baseW else (baseW * 1.32f).toInt()

                          secondaryContainer.layoutParams = FrameLayout.LayoutParams(baseW, baseH, Gravity.TOP or Gravity.START)
                          secondaryContainer.background = pillDrawable("#000000", if (isCircle) 999 else 24, "#FFFFFFFF", 3)
                          secondaryContainer.clipToOutline = true
                          secondaryContainer.outlineProvider = object : ViewOutlineProvider() {
                              override fun getOutline(view: View, outline: Outline) {
                                  if (isCircle) {
                                      outline.setOval(0, 0, view.width, view.height)
                                  } else {
                                      outline.setRoundRect(0, 0, view.width, view.height, dp(24).toFloat())
                                  }
                              }
                          }
                          secondaryContainer.post {
                              if (hasCustomPipPos) {
                                  secondaryContainer.x = pipDragX
                                  secondaryContainer.y = pipDragY
                              } else {
                                  secondaryContainer.x = (W - baseW - dp(16)).toFloat()
                                  secondaryContainer.y = (H - baseH - dp(68)).toFloat()
                              }
                          }
                      }
                      2 -> {
                          // 70 / 30 Split
                          val splitH = (H * 0.68f).toInt()
                          primaryContainer.layoutParams = FrameLayout.LayoutParams(W, splitH, Gravity.TOP or Gravity.START)
                          secondaryContainer.layoutParams = FrameLayout.LayoutParams(W, H - splitH, Gravity.TOP or Gravity.START)
                          primaryContainer.clipToOutline = false
                          secondaryContainer.clipToOutline = false
                          primaryContainer.background = null
                          secondaryContainer.background = null
                          primaryContainer.post { primaryContainer.x = 0f; primaryContainer.y = 0f }
                          secondaryContainer.post { secondaryContainer.x = 0f; secondaryContainer.y = splitH.toFloat() }
                      }
                      3 -> {
                          // 50 / 50 Split
                          val halfH = H / 2
                          primaryContainer.layoutParams = FrameLayout.LayoutParams(W, halfH, Gravity.TOP or Gravity.START)
                          secondaryContainer.layoutParams = FrameLayout.LayoutParams(W, H - halfH, Gravity.TOP or Gravity.START)
                          primaryContainer.clipToOutline = false
                          secondaryContainer.clipToOutline = false
                          primaryContainer.background = null
                          secondaryContainer.background = null
                          primaryContainer.post { primaryContainer.x = 0f; primaryContainer.y = 0f }
                          secondaryContainer.post { secondaryContainer.x = 0f; secondaryContainer.y = halfH.toFloat() }
                      }
                      4 -> {
                          // Side-by-Side (Left / Right)
                          val halfW = W / 2
                          primaryContainer.layoutParams = FrameLayout.LayoutParams(halfW, H, Gravity.TOP or Gravity.START)
                          secondaryContainer.layoutParams = FrameLayout.LayoutParams(W - halfW, H, Gravity.TOP or Gravity.START)
                          primaryContainer.clipToOutline = false
                          secondaryContainer.clipToOutline = false
                          primaryContainer.background = null
                          secondaryContainer.background = null
                          primaryContainer.post { primaryContainer.x = 0f; primaryContainer.y = 0f }
                          secondaryContainer.post { secondaryContainer.x = halfW.toFloat(); secondaryContainer.y = 0f }
                      }
                  }
              }

              private fun startDualConcurrentCamera() {
                  val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                  cameraProviderFuture.addListener({
                      val cameraProvider = cameraProviderFuture.get()
                      val extensionsFuture = ExtensionsManager.getInstanceAsync(this, cameraProvider)
                      extensionsFuture.addListener({
                          val extensionsManager = extensionsFuture.get()
                          cameraProvider.unbindAll()

                          var primaryRearSelector: CameraSelector? = null
                          var secondaryFrontSelector: CameraSelector? = null

                          for (cameraInfos in cameraProvider.availableConcurrentCameraInfos) {
                              primaryRearSelector = cameraInfos.firstOrNull {
                                  it.lensFacing == CameraSelector.LENS_FACING_BACK
                              }?.cameraSelector
                              secondaryFrontSelector = cameraInfos.firstOrNull {
                                  it.lensFacing == CameraSelector.LENS_FACING_FRONT
                              }?.cameraSelector
                              if (primaryRearSelector != null && secondaryFrontSelector != null) break
                          }

                          val rearSelector = primaryRearSelector ?: CameraSelector.DEFAULT_BACK_CAMERA
                          val frontSelector = secondaryFrontSelector ?: CameraSelector.DEFAULT_FRONT_CAMERA

                          val pRear = Preview.Builder().build().also {
                              it.setSurfaceProvider(previewRear.surfaceProvider)
                          }
                          val pFront = Preview.Builder().build().also {
                              it.setSurfaceProvider(previewFront.surfaceProvider)
                          }

                          if (primaryRearSelector != null && secondaryFrontSelector != null) {
                              val primaryConfig = SingleCameraConfig(
                                  rearSelector,
                                  UseCaseGroup.Builder().addUseCase(pRear).build(),
                                  this
                              )
                              val secondaryConfig = SingleCameraConfig(
                                  frontSelector,
                                  UseCaseGroup.Builder().addUseCase(pFront).build(),
                                  this
                              )
                              val concurrentCamera = cameraProvider.bindToLifecycle(listOf(primaryConfig, secondaryConfig))
                              rearCamera = concurrentCamera.cameras.firstOrNull {
                                  it.cameraInfo.lensFacing == CameraSelector.LENS_FACING_BACK
                              } ?: concurrentCamera.cameras.firstOrNull()
                              frontCamera = concurrentCamera.cameras.firstOrNull {
                                  it.cameraInfo.lensFacing == CameraSelector.LENS_FACING_FRONT
                              }
                          } else {
                              val hdrRear = if (extensionsManager.isExtensionAvailable(rearSelector, ExtensionMode.HDR)) {
                                  extensionsManager.getExtensionEnabledCameraSelector(rearSelector, ExtensionMode.HDR)
                              } else rearSelector
                              rearCamera = cameraProvider.bindToLifecycle(this, hdrRear, pRear)
                          }
                      }, ContextCompat.getMainExecutor(this))
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun triggerPixelShutterSequence(shutterDisc: View) {
                  shutterDisc.performHapticFeedback(HapticFeedbackConstants.CONFIRM)
                  shutterDisc.animate().scaleX(0.82f).scaleY(0.82f).setDuration(70).withEndAction {
                      shutterDisc.animate().scaleX(1f).scaleY(1f).setDuration(140).start()
                  }.start()

                  if (timerSeconds <= 0) {
                      executeImmediateCapture()
                  } else {
                      var remaining = timerSeconds
                      countdownLabel.visibility = View.VISIBLE
                      countdownLabel.text = remaining.toString()

                      val tick = object : Runnable {
                          override fun run() {
                              remaining -= 1
                              if (remaining > 0) {
                                  countdownLabel.text = remaining.toString()
                                  countdownLabel.scaleX = 1.25f
                                  countdownLabel.scaleY = 1.25f
                                  countdownLabel.animate().scaleX(1f).scaleY(1f).setDuration(220).start()
                                  mainHandler.postDelayed(this, 1000)
                              } else {
                                  countdownLabel.visibility = View.GONE
                                  executeImmediateCapture()
                              }
                          }
                      }
                      mainHandler.postDelayed(tick, 1000)
                  }
              }

              private fun executeImmediateCapture() {
                  shutterSound.play(MediaActionSound.SHUTTER_CLICK)

                  flashOverlay.alpha = 0.92f
                  flashOverlay.animate().alpha(0f).setDuration(260).start()

                  captureDualCompositeToGallery()
              }

              private fun captureDualCompositeToGallery() {
                  val rearBmp = previewRear.bitmap
                  val frontBmp = previewFront.bitmap
                  if (rearBmp == null && frontBmp == null) {
                      Toast.makeText(this, "Camera sensors warming up...", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val outW = stageCard.width.takeIf { it > 0 } ?: 1080
                  val outH = stageCard.height.takeIf { it > 0 } ?: 1440
                  val combined = Bitmap.createBitmap(outW, outH, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(combined)
                  canvas.drawColor(Color.BLACK)

                  val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
                  if (lookIndex != 0) {
                      paint.colorFilter = ColorMatrixColorFilter(getSelectedColorMatrix())
                  }

                  val primaryContainer = if (swapSlots) frontContainer else rearContainer
                  val secondaryContainer = if (swapSlots) rearContainer else frontContainer
                  val primaryBmp = if (swapSlots) frontBmp else rearBmp
                  val secondaryBmp = if (swapSlots) rearBmp else frontBmp

                  // 1. Draw Primary Feed
                  primaryBmp?.let { bmp ->
                      val dst = RectF(
                          primaryContainer.x,
                          primaryContainer.y,
                          primaryContainer.x + primaryContainer.width,
                          primaryContainer.y + primaryContainer.height
                      )
                      canvas.drawBitmap(bmp, null, dst, paint)
                  }

                  // 2. Draw Secondary Feed (with Circle or Rounded Card mask when in Floating Mode)
                  secondaryBmp?.let { bmp ->
                      val sx = secondaryContainer.x
                      val sy = secondaryContainer.y
                      val sw = secondaryContainer.width.toFloat()
                      val sh = secondaryContainer.height.toFloat()
                      val dst = RectF(sx, sy, sx + sw, sy + sh)

                      canvas.save()
                      val clipPath = Path()
                      if (layoutMode == 1) {
                          clipPath.addOval(dst, Path.Direction.CW)
                          canvas.clipPath(clipPath)
                      } else if (layoutMode == 0) {
                          clipPath.addRoundRect(dst, dp(24).toFloat(), dp(24).toFloat(), Path.Direction.CW)
                          canvas.clipPath(clipPath)
                      }
                      canvas.drawBitmap(bmp, null, dst, paint)
                      canvas.restore()

                      if (layoutMode == 0 || layoutMode == 1) {
                          val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              style = Paint.Style.STROKE
                              color = Color.WHITE
                              strokeWidth = dp(3).toFloat()
                          }
                          if (layoutMode == 1) {
                              canvas.drawOval(dst, borderPaint)
                          } else {
                              canvas.drawRoundRect(dst, dp(24).toFloat(), dp(24).toFloat(), borderPaint)
                          }
                      }
                  }

                  // Update Bottom-Left Gallery Well with Pixel Spring Pop-In Animation
                  captureCount += 1
                  photoCountBadge.text = captureCount.toString()
                  photoCountBadge.visibility = View.VISIBLE
                  thumbView.setImageBitmap(combined)
                  thumbView.scaleX = 0.25f
                  thumbView.scaleY = 0.25f
                  thumbView.animate().scaleX(1f).scaleY(1f).setDuration(280).start()

                  val values = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, "Pixel11Pro_DualSight_" + System.currentTimeMillis() + ".png")
                      put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                      put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Pixel11DualSight")
                  }
                  val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                  if (uri != null) {
                      lastSavedUri = uri
                      contentResolver.openOutputStream(uri)?.use { out ->
                          combined.compress(Bitmap.CompressFormat.PNG, 100, out)
                      }
                      Toast.makeText(this, "Saved (${lookLabels[lookIndex]}) • Tap thumbnail to view", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  shutterSound.release()
              }

              // Custom 3x3 Rule-of-Thirds Grid View
              private class GridOverlayView(context: Context) : View(context) {
                  private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#44FFFFFF")
                      strokeWidth = 2f
                      style = Paint.Style.STROKE
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val w = width.toFloat()
                      val h = height.toFloat()
                      canvas.drawLine(w / 3f, 0f, w / 3f, h, linePaint)
                      canvas.drawLine(w * 2f / 3f, 0f, w * 2f / 3f, h, linePaint)
                      canvas.drawLine(0f, h / 3f, w, h / 3f, linePaint)
                      canvas.drawLine(0f, h * 2f / 3f, w, h * 2f / 3f, linePaint)
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compile Android APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Pixel11-DualSight.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel11-DualSight-APK
          path: Pixel11-DualSight.apk

      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Pixel11-DualSight.apk \
            --title "Pixel 11 Pro XL Dual Sight APK (Build #${{ github.run_number }})" \
            --notes "Tap **Pixel11-DualSight.apk** under Assets below to download and install directly on your Pixel 11 Pro XL."
