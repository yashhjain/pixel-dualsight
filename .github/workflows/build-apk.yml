name: Build Pixel 11 Dual Sight APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Android CameraX Project Files
        run: |
          mkdir -p app/src/main/java/com/pixel11/dualsight

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Pixel11DualSight"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pixel11.dualsight"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.pixel11.dualsight"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 8
                  versionName = "8.0.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              val cameraxVersion = "1.4.0"
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.camera:camera-core:$cameraxVersion")
              implementation("androidx.camera:camera-camera2:$cameraxVersion")
              implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
              implementation("androidx.camera:camera-view:$cameraxVersion")
              implementation("androidx.camera:camera-extensions:$cameraxVersion")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.camera.any" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-feature android:name="android.hardware.camera.concurrent" android:required="false" />
              <uses-permission android:name="android.permission.CAMERA" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Dual Sight Pro"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:colorMode="hdr"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/pixel11/dualsight/MainActivity.kt
          package com.pixel11.dualsight

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.AlertDialog
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.Outline
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Rect
          import android.graphics.RectF
          import android.graphics.RenderEffect
          import android.graphics.SurfaceTexture
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.hardware.camera2.params.StreamConfigurationMap
          import android.media.MediaActionSound
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.MediaStore
          import android.util.Range
          import android.util.Rational
          import android.util.Size
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.Surface
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.view.WindowManager
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ConcurrentCamera.SingleCameraConfig
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.Preview
          import androidx.camera.core.UseCaseGroup
          import androidx.camera.core.resolutionselector.AspectRatioStrategy
          import androidx.camera.core.resolutionselector.ResolutionSelector
          import androidx.camera.core.resolutionselector.ResolutionStrategy
          import androidx.camera.extensions.ExtensionsManager
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import kotlin.math.abs
          import kotlin.math.atan2
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt

          class MainActivity : AppCompatActivity(), SensorEventListener {

              data class DiscoveredLens(
                  val key: String,
                  val ratioLabel: String,
                  val subLabel: String,
                  val targetZoom: Float,
                  val selector: CameraSelector
              )

              private lateinit var rootLayout: LinearLayout
              private lateinit var topHud: LinearLayout
              private lateinit var stageCard: FrameLayout
              private lateinit var rearContainer: FrameLayout
              private lateinit var frontContainer: FrameLayout
              private lateinit var previewRear: PreviewView
              private lateinit var previewFront: PreviewView
              private lateinit var frozenRearOverlay: ImageView
              private lateinit var ringLightBorderView: View
              private lateinit var gridOverlayView: GridOverlayView
              private lateinit var spiritLevelView: SpiritLevelView
              private lateinit var histogramView: HistogramView
              private lateinit var splitGradeBadge: TextView

              // Exposure (EV) Vertical Control
              private lateinit var evControlBox: LinearLayout
              private lateinit var evValueLabel: TextView
              private lateinit var evSeekBar: SeekBar

              // Polaroid & Photobooth Quick Action Pill Bar inside Viewfinder
              private lateinit var creativeActionRow: LinearLayout
              private lateinit var btnFreezeTopHalf: TextView
              private lateinit var btnEditCaption: TextView
              private lateinit var btnShareLatest: TextView
              private lateinit var polaroidFooterBar: LinearLayout
              private lateinit var polaroidExifText: TextView
              private lateinit var polaroidCaptionText: TextView

              // Interactive HUD elements
              private lateinit var liveZoomHudBadge: LinearLayout
              private lateinit var liveZoomNumberText: TextView
              private lateinit var liveZoomSensorText: TextView
              private lateinit var focusAssembly: LinearLayout
              private lateinit var focusRingCircle: FrameLayout
              private lateinit var focusTagTitle: TextView
              private lateinit var focusTagSub: TextView

              private lateinit var dropdownOverlayContainer: FrameLayout
              private lateinit var viewDropdownMenu: LinearLayout
              private lateinit var lookDropdownMenu: LinearLayout
              private lateinit var btnLookTargetToggle: TextView
              private lateinit var quickReviewDrawer: LinearLayout
              private lateinit var quickReviewImage: ImageView
              private lateinit var flashOverlay: View
              private lateinit var countdownLabel: TextView

              // Bottom / Side deck
              private lateinit var bottomDeck: LinearLayout
              private lateinit var zoomCapsuleLayout: LinearLayout
              private lateinit var lensScroll: HorizontalScrollView
              private lateinit var lensCardsRowLayout: LinearLayout
              private lateinit var modeStripRow: LinearLayout
              private lateinit var shutterRowContainer: FrameLayout
              private lateinit var leftControlsGroup: LinearLayout
              private lateinit var shutterOuterRing: FrameLayout
              private lateinit var shutterInnerDisc: View
              private lateinit var btnSwapCams: TextView
              private lateinit var thumbView: ImageView
              private lateinit var photoCountBadge: TextView
              private lateinit var resolutionTelemetryBadge: TextView

              private lateinit var btnViewDropdown: TextView
              private lateinit var btnLookDropdown: TextView
              private lateinit var btnTripleSaveChip: TextView
              private lateinit var btnMaxResChip: TextView
              private lateinit var btnFlashChip: TextView
              private lateinit var btnTimerChip: TextView
              private lateinit var btnLevelHudChip: TextView

              private val deckZoomButtons = mutableMapOf<Float, TextView>()
              private val lensRoleCards = mutableMapOf<String, LinearLayout>()
              private val lensRoleTopTexts = mutableMapOf<String, TextView>()
              private val lensRoleSubTexts = mutableMapOf<String, TextView>()
              private val modeTabs = mutableMapOf<Int, TextView>()
              private val viewMenuRows = mutableListOf<TextView>()
              private val lookMenuRows = mutableListOf<TextView>()

              private var cachedProvider: ProcessCameraProvider? = null
              private var cachedExtensions: ExtensionsManager? = null
              private var rearCamera: Camera? = null
              private var frontCamera: Camera? = null
              private var rearPreviewUseCase: Preview? = null
              private var frontPreviewUseCase: Preview? = null
              private var isBindingCameras = false
              private var isCapturingPhoto = false

              // Sensor Manager for Electronic Horizon Spirit Level
              private var sensorManager: SensorManager? = null
              private var gravitySensor: Sensor? = null
              private var currentRollDeg: Float = 0f

              // Dynamic device hardware profile
              private var deviceModelName: String = Build.MODEL ?: "Android"
              private var rearSensorMp: Int = 50
              private var frontSensorMp: Int = 12
              private var deviceMinZoom: Float = 0.5f
              private var deviceMaxZoom: Float = 10.0f
              private var bestRear16x9Size: Size = Size(3840, 2160)
              private var bestRear4x3Size: Size = Size(4000, 3000)
              private var bestFront16x9Size: Size = Size(2560, 1440)
              private var bestFront4x3Size: Size = Size(3264, 2448)

              private var logicalBackSelector: CameraSelector = CameraSelector.DEFAULT_BACK_CAMERA
              private var defaultFrontSelector: CameraSelector = CameraSelector.DEFAULT_FRONT_CAMERA
              private val discoveredRearLenses = mutableListOf<DiscoveredLens>()
              private var dynamicZoomStops = listOf(0.5f, 1.0f, 2.0f, 5.0f, 10.0f)
              private var selectedLensRole: String = "AUTO"

              // Pro & Creative feature states
              private var proMaxResMode = false
              private var tripleSaveEnabled = false
              private var flashRingMode = 0 // 0 = Off, 1 = Rear Torch, 2 = Selfie Ring-Light, 3 = Both
              private var hudOverlayMode = 0 // 0 = Off, 1 = Grid + Level + Histogram, 2 = Level Only, 3 = Grid Only
              private var captureMode = 0 // 0 = PHOTO, 1 = FREEZE BOOTH, 2 = BURST 4x
              private var isTopHalfFrozen = false
              private var frozenTopBitmap: Bitmap? = null
              private var customCaption: String = "Shot on Dual Sight Pro"

              // Independent Split Color Grading (Rear vs Front Look!)
              private var lookTargetMode = 0 // 0 = Both Cameras, 1 = Rear Camera Only, 2 = Front Camera Only
              private var rearLookIndex = 0
              private var frontLookIndex = 0
              private val lookLabels = listOf("Natural", "Vivid Pop", "Golden Hour", "Cyber Teal", "Leica Mono", "Vintage")

              // 0 = PiP Card, 1 = Circle Bubble, 2 = 70/30 Split, 3 = 50/50 Split, 4 = Left/Right, 5 = Polaroid Duo
              private var layoutMode = 0
              private val layoutLabels = listOf("PiP Card", "Circle Bubble", "70/30 Split", "50/50 Split", "Left/Right", "Polaroid Duo")
              private var pipScale = 1.0f

              private var currentZoom = 1.0f
              private var lastZoomApplyMs = 0L
              private var swapSlots = false
              private var timerSeconds = 0
              private var captureCount = 0
              private var lastSavedUri: Uri? = null
              private var lastCapturedBitmap: Bitmap? = null

              private val shutterSound = MediaActionSound()
              private val mainHandler = Handler(Looper.getMainLooper())
              private val ioExecutor = Executors.newSingleThreadExecutor()

              private var pipDragX = 0f
              private var pipDragY = 0f
              private var hasCustomPipPos = false

              private val hideZoomHudRunnable = Runnable {
                  liveZoomHudBadge.animate().alpha(0f).setDuration(280).start()
              }

              private val histogramTickRunnable = object : Runnable {
                  override fun run() {
                      if (histogramView.visibility == View.VISIBLE && !isCapturingPhoto) {
                          val bmp = previewRear.bitmap
                          if (bmp != null) {
                              ioExecutor.execute {
                                  val bins = computeFastLuminanceBins(bmp)
                                  bmp.recycle()
                                  mainHandler.post {
                                      histogramView.updateBins(bins)
                                  }
                              }
                          }
                      }
                      mainHandler.postDelayed(this, 260L)
                  }
              }

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  if (granted) initializeCameraProvider()
                  else Toast.makeText(this, "Camera permission is required", Toast.LENGTH_LONG).show()
              }

              private fun dp(value: Int): Int =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value.toFloat(), resources.displayMetrics).toInt()

              private fun pillDrawable(fillHex: String, radiusDp: Int, strokeHex: String? = null, strokeDp: Int = 0): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor(fillHex))
                      cornerRadius = dp(radiusDp).toFloat()
                      if (strokeHex != null && strokeDp > 0) {
                          setStroke(dp(strokeDp), Color.parseColor(strokeHex))
                      }
                  }
              }

              private fun circleDrawable(fillHex: String, strokeHex: String? = null, strokeDp: Int = 0): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(Color.parseColor(fillHex))
                      if (strokeHex != null && strokeDp > 0) {
                          setStroke(dp(strokeDp), Color.parseColor(strokeHex))
                      }
                  }
              }

              private fun formatZoomLabel(z: Float): String {
                  val rounded1 = (z * 10f).roundToInt() / 10f
                  return if (abs(rounded1 - rounded1.roundToInt()) < 0.05f) {
                      "${rounded1.roundToInt()}x"
                  } else {
                      "${rounded1}x"
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#07080C")
                  window.navigationBarColor = Color.parseColor("#07080C")
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      window.attributes = window.attributes.apply {
                          layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
                  shutterSound.load(MediaActionSound.SHUTTER_CLICK)
                  shutterSound.load(MediaActionSound.FOCUS_COMPLETE)

                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as? SensorManager
                  gravitySensor = sensorManager?.getDefaultSensor(Sensor.TYPE_GRAVITY)
                      ?: sensorManager?.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)

                  buildAppUI()
                  updateOrientationLayout(resources.configuration.orientation)

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      initializeCameraProvider()
                  } else {
                      permissionLauncher.launch(Manifest.permission.CAMERA)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  gravitySensor?.let {
                      sensorManager?.registerListener(this, it, SensorManager.SENSOR_DELAY_UI)
                  }
                  mainHandler.removeCallbacks(histogramTickRunnable)
                  mainHandler.postDelayed(histogramTickRunnable, 400L)
              }

              override fun onPause() {
                  super.onPause()
                  sensorManager?.unregisterListener(this)
                  mainHandler.removeCallbacks(histogramTickRunnable)
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event == null || spiritLevelView.visibility != View.VISIBLE) return
                  val gx = event.values[0]
                  val gy = event.values[1]
                  val rawAngle = Math.toDegrees(atan2(gx.toDouble(), gy.toDouble())).toFloat()
                  currentRollDeg = currentRollDeg * 0.82f + rawAngle * 0.18f
                  spiritLevelView.updateAngle(currentRollDeg)
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  updateOrientationLayout(newConfig.orientation)
                  val displayRotation = when (windowManager.defaultDisplay?.rotation ?: Surface.ROTATION_0) {
                      Surface.ROTATION_0 -> Surface.ROTATION_0
                      Surface.ROTATION_90 -> Surface.ROTATION_90
                      Surface.ROTATION_180 -> Surface.ROTATION_180
                      Surface.ROTATION_270 -> Surface.ROTATION_270
                      else -> Surface.ROTATION_0
                  }
                  rearPreviewUseCase?.targetRotation = displayRotation
                  frontPreviewUseCase?.targetRotation = displayRotation
              }

              private fun buildAppUI() {
                  rootLayout = LinearLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#07080C"))
                  }

                  // 1. TOP FROSTED HEADER BAR WITH "View: ... v" & "Look: ... v" DROPDOWNS + PRO UTILITY ICONS
                  topHud = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = pillDrawable("#222634", 24, "#30FFFFFF", 1)
                      setPadding(dp(8), dp(6), dp(8), dp(6))
                  }

                  btnViewDropdown = TextView(this).apply {
                      text = "View: PiP Card ▾"
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      background = pillDrawable("#32384D", 18, "#45FFFFFF", 1)
                      setPadding(dp(10), dp(5), dp(10), dp(5))
                      setOnClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                          toggleTopDropdown(showViewMenu = true)
                      }
                  }

                  btnLookDropdown = TextView(this).apply {
                      text = "Look: Natural ▾"
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      background = pillDrawable("#2A2F42", 18, "#33FFFFFF", 1)
                      setPadding(dp(10), dp(5), dp(10), dp(5))
                      setOnClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                          toggleTopDropdown(showViewMenu = false)
                      }
                  }

                  btnTripleSaveChip = buildIconCircleChip("3x") {
                      tripleSaveEnabled = !tripleSaveEnabled
                      btnTripleSaveChip.background = if (tripleSaveEnabled) circleDrawable("#FACC15") else circleDrawable("#2E3446", "#33FFFFFF", 1)
                      btnTripleSaveChip.setTextColor(if (tripleSaveEnabled) Color.BLACK else Color.WHITE)
                      Toast.makeText(
                          this@MainActivity,
                          if (tripleSaveEnabled) "3x Save ON: Saves Composite + Separate Rear & Front"
                          else "Single Composite Save",
                          Toast.LENGTH_SHORT
                      ).show()
                  }

                  btnMaxResChip = buildIconCircleChip("MAX") {
                      proMaxResMode = !proMaxResMode
                      btnMaxResChip.background = if (proMaxResMode) circleDrawable("#38BDF8") else circleDrawable("#2E3446", "#33FFFFFF", 1)
                      btnMaxResChip.setTextColor(if (proMaxResMode) Color.BLACK else Color.WHITE)
                      Toast.makeText(
                          this@MainActivity,
                          if (proMaxResMode) "Max 4:3 Sensor Resolution Active" else "Widescreen 16:9 Stream Active",
                          Toast.LENGTH_SHORT
                      ).show()
                      bindDualCamerasSafely()
                  }

                  btnFlashChip = buildIconCircleChip("⚡") {
                      flashRingMode = (flashRingMode + 1) % 4
                      val useTorch = (flashRingMode == 1 || flashRingMode == 3)
                      val useRing = (flashRingMode == 2 || flashRingMode == 3)
                      rearCamera?.cameraControl?.enableTorch(useTorch)
                      ringLightBorderView.visibility = if (useRing) View.VISIBLE else View.GONE

                      val lp = window.attributes
                      lp.screenBrightness = if (useRing) 1.0f else WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE
                      window.attributes = lp

                      btnFlashChip.text = when (flashRingMode) {
                          1 -> "⚡"
                          2 -> "◎"
                          3 -> "⚡◎"
                          else -> "⚡"
                      }
                      btnFlashChip.background = if (flashRingMode > 0) circleDrawable("#F59E0B") else circleDrawable("#2E3446", "#33FFFFFF", 1)
                      btnFlashChip.setTextColor(if (flashRingMode > 0) Color.BLACK else Color.WHITE)
                      val modeDesc = when (flashRingMode) {
                          1 -> "Rear Torch ON"
                          2 -> "Front Selfie Studio Ring-Light ON"
                          3 -> "Rear Torch + Selfie Ring-Light ON"
                          else -> "Flash & Ring-Light OFF"
                      }
                      Toast.makeText(this@MainActivity, modeDesc, Toast.LENGTH_SHORT).show()
                  }

                  btnTimerChip = buildIconCircleChip("⏱") {
                      timerSeconds = when (timerSeconds) {
                          0 -> 3
                          3 -> 5
                          else -> 0
                      }
                      btnTimerChip.text = if (timerSeconds == 0) "⏱" else "${timerSeconds}s"
                      btnTimerChip.background = if (timerSeconds > 0) circleDrawable("#3B82F6") else circleDrawable("#2E3446", "#33FFFFFF", 1)
                  }

                  btnLevelHudChip = buildIconCircleChip("⊞") {
                      hudOverlayMode = (hudOverlayMode + 1) % 4
                      gridOverlayView.visibility = if (hudOverlayMode == 1 || hudOverlayMode == 3) View.VISIBLE else View.GONE
                      spiritLevelView.visibility = if (hudOverlayMode == 1 || hudOverlayMode == 2) View.VISIBLE else View.GONE
                      histogramView.visibility = if (hudOverlayMode == 1) View.VISIBLE else View.GONE
                      evControlBox.visibility = if (hudOverlayMode == 1 || hudOverlayMode == 2) View.VISIBLE else View.GONE
                      btnLevelHudChip.background = if (hudOverlayMode > 0) circleDrawable("#34D399") else circleDrawable("#2E3446", "#33FFFFFF", 1)
                      btnLevelHudChip.setTextColor(if (hudOverlayMode > 0) Color.BLACK else Color.WHITE)
                  }

                  topHud.addView(btnViewDropdown, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(32)).apply { rightMargin = dp(5) })
                  topHud.addView(btnLookDropdown, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, dp(32)))
                  topHud.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                  topHud.addView(btnTripleSaveChip, LinearLayout.LayoutParams(dp(30), dp(30)).apply { rightMargin = dp(4) })
                  topHud.addView(btnMaxResChip, LinearLayout.LayoutParams(dp(30), dp(30)).apply { rightMargin = dp(4) })
                  topHud.addView(btnFlashChip, LinearLayout.LayoutParams(dp(30), dp(30)).apply { rightMargin = dp(4) })
                  topHud.addView(btnTimerChip, LinearLayout.LayoutParams(dp(30), dp(30)).apply { rightMargin = dp(4) })
                  topHud.addView(btnLevelHudChip, LinearLayout.LayoutParams(dp(30), dp(30)))

                  // 2. EXPANSIVE ROUNDED 24DP VIEWFINDER STAGE
                  stageCard = FrameLayout(this).apply {
                      background = pillDrawable("#000000", 24, "#29FFFFFF", 1)
                      clipChildren = true
                      clipToPadding = true
                      clipToOutline = true
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, dp(24).toFloat())
                          }
                      }
                  }

                  rearContainer = FrameLayout(this).apply {
                      clipChildren = true
                      clipToPadding = true
                      elevation = 0f
                  }
                  frontContainer = FrameLayout(this).apply {
                      clipChildren = true
                      clipToPadding = true
                      elevation = dp(4).toFloat()
                  }

                  previewRear = PreviewView(this).apply {
                      implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                      scaleType = PreviewView.ScaleType.FILL_CENTER
                  }
                  previewFront = PreviewView(this).apply {
                      implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                      scaleType = PreviewView.ScaleType.FILL_CENTER
                  }

                  frozenRearOverlay = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      visibility = View.GONE
