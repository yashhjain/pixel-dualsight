                  shutterRow.addView(leftControlsGroup, FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.START or Gravity.CENTER_VERTICAL))
                  shutterRow.addView(shutterOuterRing, FrameLayout.LayoutParams(dp(76), dp(76), Gravity.CENTER))
                  shutterRow.addView(btnSwapCams, FrameLayout.LayoutParams(dp(84), dp(48), Gravity.END or Gravity.CENTER_VERTICAL))

                  bottomDeck.addView(shutterRow, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  root.addView(bottomDeck, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  setContentView(root)

                  stageCard.post {
